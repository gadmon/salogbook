<!DOCTYPE html>
<!-- SALOGBOOK v1.0 - Springbok Aviation Logbook - Multi-user SACAA Compliant -->
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="SALOGBOOK"/>
  <meta name="theme-color" content="#0A1628"/>
  <title>SALOGBOOK - Springbok Aviation Logbook</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23006B3F'/><text y='.9em' font-size='65' x='10'>SB</text></svg>"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{
      --bg:#0A1628;--surf:#0F1E35;--card:#142340;--border:#1E3357;
      --green:#006B3F;--gold:#FFB612;--red:#E8334A;--blue:#1E88E5;
      --sky:#38BDF8;--purple:#A78BFA;--amber:#F59E0B;--teal:#14B8A6;
      --text:#F0F6FF;--dim:#CBD5E1;--steel:#7A95B8;--muted:#3D5A7A;
    }
    body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%;min-height:100vh}
    #app{min-height:100vh}
    /* Auth screen */
    .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#0A1628,#0F2040)}
    .auth-card{background:var(--surf);border:1px solid var(--border);border-radius:14px;padding:32px 28px;width:100%;max-width:400px}
    .auth-logo{display:flex;align-items:center;gap:12px;margin-bottom:28px}
    .auth-icon{width:48px;height:48px;border-radius:11px;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:var(--gold);letter-spacing:-1px}
    .auth-title{font-size:20px;font-weight:800;color:var(--text)}
    .auth-sub{font-size:11px;color:var(--steel);margin-top:2px}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:10px;color:var(--steel);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
    .field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:9px 12px;color:var(--text);font-size:14px;outline:none;font-family:inherit;transition:border-color .15s}
    .field input:focus,.field select:focus{border-color:var(--green)}
    .btn{width:100%;padding:11px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s}
    .btn-primary{background:var(--green);color:var(--gold)}
    .btn-secondary{background:var(--card);color:var(--steel);border:1px solid var(--border)}
    .btn:hover{opacity:.9}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .err{background:#E8334A22;border:1px solid #E8334A55;border-radius:6px;padding:9px 12px;font-size:12px;color:#F87171;margin-bottom:12px}
    .ok{background:#006B3F22;border:1px solid #006B3F55;border-radius:6px;padding:9px 12px;font-size:12px;color:#4ADE80;margin-bottom:12px}
    /* Main app */
    .header{background:var(--surf);border-bottom:1px solid var(--border);padding:0 16px;position:sticky;top:0;z-index:100}
    .header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:52px}
    .hlogo{display:flex;align-items:center;gap:9px}
    .hicon{width:34px;height:34px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:var(--gold)}
    .tabs{display:flex;overflow-x:auto;border-top:1px solid var(--border)}
    .tabs::-webkit-scrollbar{display:none}
    .tab{background:none;border:none;color:var(--steel);padding:9px 14px;font-size:13px;font-weight:400;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-family:inherit}
    .tab.active{color:var(--gold);font-weight:700;border-bottom-color:var(--gold)}
    .main{max-width:1100px;margin:0 auto;padding:14px}
    /* Stat card */
    .stat{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 13px;min-width:90px}
    .stat-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
    .stat-value{font-family:monospace;font-size:18px;font-weight:800;line-height:1}
    .stat-unit{font-size:9px;color:var(--muted);font-weight:400;margin-left:2px}
    /* Table */
    .tbl{width:100%;border-collapse:collapse;font-size:12px}
    .tbl th{padding:5px 7px;color:var(--steel);text-align:left;font-weight:600;font-size:9px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border)}
    .tbl td{padding:8px 7px;border-bottom:1px solid var(--border)22;vertical-align:top}
    .tbl tr:hover td{background:var(--card)}
    .tbl tfoot td{padding:5px 7px;font-weight:700;border-top:2px solid var(--green);font-family:monospace}
    /* Modals */
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:500;display:flex;align-items:center;justify-content:center;padding:12px}
    .modal{background:var(--surf);border:1px solid var(--border);border-radius:13px;width:100%;max-width:600px;max-height:92vh;overflow-y:auto}
    .modal-head{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surf);z-index:2}
    .modal-body{padding:16px 18px}
    .close-btn{background:none;border:none;color:var(--steel);font-size:20px;cursor:pointer;padding:2px 6px;border-radius:4px}
    .close-btn:hover{background:var(--card)}
    /* Progress bar */
    .pbar-wrap{background:var(--surf);border-radius:4px;height:5px;overflow:hidden}
    .pbar-fill{height:100%;border-radius:4px;transition:width .6s ease}
    /* Badges */
    .badge{border-radius:4px;padding:2px 7px;font-size:10px;font-weight:600;display:inline-block}
    /* Toast */
    .toast{position:fixed;bottom:24px;right:16px;background:var(--green);color:var(--gold);padding:11px 18px;border-radius:9px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.4);animation:fadeup .3s ease}
    @keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    /* Upload zone */
    .upload-zone{border:2px dashed var(--border);border-radius:9px;padding:24px;text-align:center;cursor:pointer;transition:border-color .2s}
    .upload-zone:hover,.upload-zone.drag{border-color:var(--green)}
    /* Scrollbar */
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-track{background:var(--bg)}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
    @supports(padding:max(0px)){body{padding-bottom:env(safe-area-inset-bottom)}}
    @media print{
      .header,.tabs,.btn,button,.modal-bg{display:none!important}
      body,*{background:white!important;color:black!important;border-color:#ccc!important}
      .tbl{font-size:8pt!important}
      .tbl th,.tbl td{border:1px solid #ddd!important;padding:3px 5px!important}
    }
  </style>
</head>
<body>
<div id="app"></div>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
// Replace these with your Supabase project values
const SUPABASE_URL = 'https://vxjkegfpwpuiolgzchkm.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4amtlZ2Zwd3B1aW9sZ3pjaGttIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTk4MjUsImV4cCI6MjEwNDI3NTgyNX0.5lYagCMFU5NP51poh_gcvqurX7psjI97oM_kFGvX2Ec';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ─── UTILS ───────────────────────────────────────────────────────────────────
const hhmm = h => { if(!h) return '0:00'; const hh=Math.floor(h),mm=Math.round((h-hh)*60); return hh+':'+String(mm).padStart(2,'0'); };
const fmtDate = s => { if(!s) return ''; const [y,m,d]=s.split('-'); return d+'/'+m+'/'+y; };
const today = () => new Date().toISOString().slice(0,10);
const num = v => parseFloat(v)||0;

let _toast = null;
function toast(msg, col='var(--green)') {
  if(_toast) _toast.remove();
  _toast = document.createElement('div');
  _toast.className = 'toast';
  _toast.style.background = col;
  _toast.textContent = msg;
  document.body.appendChild(_toast);
  setTimeout(()=>{if(_toast){_toast.remove();_toast=null;}},3000);
}

// ─── STATE ───────────────────────────────────────────────────────────────────
let state = {
  session: null, profile: null, flights: [], endorsements: [], documents: [],
  tab: 'log', loading: true, authMode: 'login',
  showFlightForm: false, editFlight: null, viewFlight: null,
  showEndorseForm: false, editEndorse: null,
  showImport: false, showDocUpload: false,
  searchQ: '', filterType: '', filterRole: '',
  sortField: 'date', sortDir: 'desc',
};

function setState(patch) { Object.assign(state, patch); render(); }

// ─── AUTH ─────────────────────────────────────────────────────────────────────
sb.auth.onAuthStateChange(async (event, session) => {
  state.session = session;
  if (session) {
    await loadProfile();
    await loadAll();
  } else {
    state.profile = null; state.flights = []; state.endorsements = []; state.documents = [];
  }
  state.loading = false;
  render();
});

async function loadProfile() {
  const { data } = await sb.from('profiles').select('*').eq('id', state.session.user.id).single();
  state.profile = data || { id: state.session.user.id, full_name: '', licence_type: 'SPL' };
}

async function loadAll() {
  const uid = state.session.user.id;
  const [f, e, d] = await Promise.all([
    sb.from('flights').select('*').eq('pilot_id', uid).order('date', {ascending: false}),
    sb.from('endorsements').select('*').eq('pilot_id', uid).order('date_issued', {ascending: false}),
    sb.from('documents').select('*').eq('pilot_id', uid).order('created_at', {ascending: false}),
  ]);
  state.flights = f.data || [];
  state.endorsements = e.data || [];
  state.documents = d.data || [];
}

async function signIn(email, password) {
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) throw error;
}

async function signUp(email, password, fullName) {
  const { error } = await sb.auth.signUp({ email, password, options: { data: { full_name: fullName } } });
  if (error) throw error;
}

async function signOut() {
  await sb.auth.signOut();
  setState({ tab: 'log', flights: [], endorsements: [], documents: [] });
}

// ─── DATA OPS ─────────────────────────────────────────────────────────────────
async function saveFlight(data) {
  const uid = state.session.user.id;
  if (data.id && !data.id.startsWith('new')) {
    const { error } = await sb.from('flights').update({...data, updated_at: new Date().toISOString()}).eq('id', data.id);
    if (error) throw error;
    state.flights = state.flights.map(f => f.id === data.id ? {...f, ...data} : f);
  } else {
    const { id: _id, ...rest } = data;
    const { data: inserted, error } = await sb.from('flights').insert({...rest, pilot_id: uid}).select().single();
    if (error) throw error;
    state.flights = [inserted, ...state.flights];
  }
  state.flights.sort((a,b) => b.date.localeCompare(a.date));
  toast('Flight saved');
  setState({ showFlightForm: false, editFlight: null });
}

async function deleteFlight(id) {
  if (!confirm('Delete this flight entry?')) return;
  const { error } = await sb.from('flights').delete().eq('id', id);
  if (error) { toast('Error deleting', 'var(--red)'); return; }
  state.flights = state.flights.filter(f => f.id !== id);
  toast('Deleted');
  setState({ viewFlight: null });
}

async function saveEndorsement(data) {
  const uid = state.session.user.id;
  if (data.id) {
    const { error } = await sb.from('endorsements').update({...data, updated_at: new Date().toISOString()}).eq('id', data.id);
    if (error) throw error;
    state.endorsements = state.endorsements.map(e => e.id === data.id ? {...e, ...data} : e);
  } else {
    const { data: ins, error } = await sb.from('endorsements').insert({...data, pilot_id: uid}).select().single();
    if (error) throw error;
    state.endorsements = [ins, ...state.endorsements];
  }
  toast('Endorsement saved');
  setState({ showEndorseForm: false, editEndorse: null });
}

async function deleteEndorsement(id) {
  if (!confirm('Delete endorsement?')) return;
  await sb.from('endorsements').delete().eq('id', id);
  state.endorsements = state.endorsements.filter(e => e.id !== id);
  toast('Deleted');
  render();
}

async function saveProfile(data) {
  const { error } = await sb.from('profiles').upsert({...data, id: state.session.user.id, updated_at: new Date().toISOString()});
  if (error) throw error;
  state.profile = { ...state.profile, ...data };
  toast('Profile saved');
  render();
}

// ─── IMPORT ───────────────────────────────────────────────────────────────────
function parseLogTenPro(text) {
  const lines = text.split('\n').filter(l => l.trim());
  if (lines.length < 2) throw new Error('No data found');

  // Detect format by checking headers
  const firstLine = lines[0].replace(/^\uFEFF/, ''); // remove BOM
  const isCSV = firstLine.includes('"Date"') || firstLine.includes('Date,');
  
  if (isCSV) {
    return parseMyFlightbook(lines);
  } else {
    return parseTabDelimited(lines);
  }
}

function parseMyFlightbook(lines) {
  // Parse CSV with quoted fields
  function parseCSVLine(line) {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        inQuotes = !inQuotes;
      } else if (ch === ',' && !inQuotes) {
        result.push(current.trim());
        current = '';
      } else {
        current += ch;
      }
    }
    result.push(current.trim());
    return result;
  }

  const headerLine = lines[0].replace(/^\uFEFF/, '').replace(/"/g, '');
  const headers = headerLine.split(',').map(h => h.trim().toLowerCase());

  function idx(name) {
    return headers.findIndex(h => h === name.toLowerCase() || h.includes(name.toLowerCase()));
  }

  const entries = [];
  for (let i = 1; i < lines.length; i++) {
    const row = parseCSVLine(lines[i]);
    if (row.length < 3) continue;

    const get = (name) => {
      const i2 = idx(name);
      return i2 >= 0 ? (row[i2] || '').trim() : '';
    };
    const getNum = (name) => parseFloat(get(name)) || 0;
    const getHHMM = (name) => {
      const v = get(name);
      if (!v) return 0;
      if (v.includes(':')) {
        const [h, m] = v.split(':');
        return parseInt(h) + parseInt(m) / 60;
      }
      return parseFloat(v) || 0;
    };

    const dateRaw = get('date');
    if (!dateRaw) continue;

    // Parse date YYYY-MM-DD
    let date = dateRaw;
    if (dateRaw.match(/^\d{1,2}\/\d{1,2}\/\d{4}$/)) {
      const [m, d, y] = dateRaw.split('/');
      date = y + '-' + m.padStart(2, '0') + '-' + d.padStart(2, '0');
    }

    const totalTime = getHHMM('total flight time (hh:mm)') || getNum('total flight time');
    const simTime = getNum('ground simulator');
    const dual = getNum('dual received');
    const pic = getNum('pic');
    const night = getNum('night');
    const simInst = getNum('simulated instrument');
    const imc = getNum('imc');
    const xc = getNum('x-country');
    const solo = getNum('solo time');
    const dayLdgs = parseInt(getNum('fs day landings')) || 0;
    const nightLdgs = parseInt(getNum('fs night landings')) || 0;
    const approaches = parseInt(getNum('approaches')) || 0;
    const holds = get('hold').toLowerCase() === 'yes' ? 1 : 0;

    // Parse route
    const route = get('route');
    const airports = route.replace(/-/g, ' ').split(' ').filter(a => a.match(/^[A-Z]{2,4}$/));
    const dep = airports[0] || '';
    const arr = airports[airports.length - 1] || dep;

    // Parse instructor from Flight Properties
    const props = get('flight properties');
    const instrMatch = props.match(/Instructor:\s*([^;]+)/i);
    const instructor = instrMatch ? instrMatch[1].trim() : get('instructor name') || get('cfi name');
    const lesson = get('lesson # / description') || get('comments');
    const picName = get('name of pic') || 'J. Durr';

    const isSim = simTime > 0 && totalTime === 0;
    const apchList = [];
    if (approaches > 0 && arr) {
      for (let j = 0; j < Math.min(approaches, 5); j++) {
        apchList.push({ type: 'ILS Cat I', rwy: '', airport: arr, result: 'Full Stop' });
      }
    }

    let role = 'Dual (Student)';
    if (isSim) role = 'Student / Trainee';
    else if (solo > 0 && dual === 0) role = 'PIC (Solo)';
    else if (pic > 0 && dual === 0 && !instructor) role = 'PIC';

    entries.push({
      pilot_id: state.session.user.id,
      date,
      source: 'myflightbook',
      duty_type: isSim ? 'Simulator Duty' : 'Flight Duty',
      flight_rules: (imc > 0 || simInst > 0 || approaches > 0) ? 'IFR' : 'VFR',
      aircraft_type: get('icao model') || get('model') || '',
      aircraft_reg: get('tail number') || '',
      dep_airport: dep,
      arr_airport: arr,
      route: route,
      total_time: isSim ? 0 : totalTime,
      sim_time: simTime || (isSim ? totalTime : 0),
      pic: pic,
      sic: getNum('sic'),
      picus: 0,
      dual: dual,
      solo: solo,
      night: night,
      ifr: imc,
      sim_inst: simInst,
      xc: xc,
      day_landings: dayLdgs,
      night_landings: nightLdgs,
      holds: holds,
      approaches: apchList,
      pilot_role: role,
      p1_name: picName,
      p2_name: instructor ? 'J. Durr' : '',
      instructor: instructor,
      lesson: lesson,
      remarks: get('comments'),
    });
  }
  return entries;
}

function parseTabDelimited(lines) {
  const headers = lines[0].split('\t').map(h => h.trim().toLowerCase().replace(/[\s\/]+/g, '_'));

  const get = (row, ...names) => {
    for (const n of names) {
      const i = headers.findIndex(h => h.includes(n));
      if (i >= 0 && row[i]) return row[i].trim();
    }
    return '';
  };
  const getNum = (row, ...names) => parseFloat(get(row, ...names)) || 0;

  const entries = [];
  for (let i = 1; i < lines.length; i++) {
    const row = lines[i].split('\t');
    if (row.length < 3) continue;
    const dateRaw = get(row, 'date');
    if (!dateRaw) continue;

    let date = dateRaw;
    if (dateRaw.match(/^\d{1,2}\/\d{1,2}\/\d{4}$/)) {
      const [m, d, y] = dateRaw.split('/');
      date = y + '-' + m.padStart(2, '0') + '-' + d.padStart(2, '0');
    } else if (dateRaw.match(/^\d{4}-\d{2}-\d{2}/)) {
      date = dateRaw.slice(0, 10);
    }

    const totalTime = getNum(row, 'flight_time', 'total', 'block');
    const simTime = getNum(row, 'sim', 'simulator', 'ground');
    if (totalTime === 0 && simTime === 0) continue;

    const approaches = [];
    const apchCount = getNum(row, 'approaches', 'approach');
    if (apchCount > 0) {
      const arr = get(row, 'to', 'arrival', 'destination');
      for (let j = 0; j < Math.min(apchCount, 5); j++) {
        approaches.push({ type: 'ILS Cat I', rwy: '', airport: arr, result: 'Full Stop' });
      }
    }

    entries.push({
      pilot_id: state.session.user.id,
      date, source: 'logten',
      duty_type: simTime > 0 && totalTime === 0 ? 'Simulator Duty' : 'Flight Duty',
      flight_rules: getNum(row, 'actual_instrument', 'imc') > 0 ? 'IFR' : 'VFR',
      aircraft_type: get(row, 'aircraft_type', 'type', 'model', 'icao'),
      aircraft_reg: get(row, 'registration', 'tail', 'reg'),
      dep_airport: get(row, 'from', 'departure', 'origin'),
      arr_airport: get(row, 'to', 'arrival', 'destination'),
      route: get(row, 'route'),
      total_time: totalTime,
      sim_time: simTime,
      pic: getNum(row, 'pic', 'pilot_in_command'),
      sic: getNum(row, 'sic', 'second_in_command', 'co_pilot'),
      picus: getNum(row, 'picus', 'pic_us'),
      dual: getNum(row, 'dual', 'dual_received'),
      solo: getNum(row, 'solo'),
      night: getNum(row, 'night'),
      ifr: getNum(row, 'actual_instrument', 'imc'),
      sim_inst: getNum(row, 'simulated_instrument', 'sim_inst'),
      xc: getNum(row, 'cross_country', 'x_country', 'xc'),
      day_landings: parseInt(getNum(row, 'day_ldg', 'day_landing', 'full_stop_day')) || 0,
      night_landings: parseInt(getNum(row, 'night_ldg', 'night_landing', 'full_stop_night')) || 0,
      holds: parseInt(getNum(row, 'holds', 'holding')) || 0,
      approaches: approaches,
      pilot_role: getNum(row, 'pic') > 0 ? 'PIC' : getNum(row, 'dual') > 0 ? 'Dual (Student)' : 'SIC',
      p1_name: get(row, 'pic_name', 'captain', 'p1'),
      p2_name: get(row, 'co_pilot_name', 'sic_name', 'p2'),
      instructor: get(row, 'instructor', 'instructor_name'),
      lesson: get(row, 'lesson', 'exercise', 'topic'),
      remarks: get(row, 'remarks', 'comments', 'notes'),
      day_takeoffs: parseInt(getNum(row, 'day_t', 'day t')) || 0,
      night_takeoffs: parseInt(getNum(row, 'night_t', 'night t')) || 0,
      day_landings: parseInt(getNum(row, 'day_ldg', 'day l')) || 0,
      night_landings: parseInt(getNum(row, 'night_ldg', 'night l')) || 0,
      pushback_time: get(row, 'off_duty', 'pushback'),
      chocks_off: get(row, 'off', 'out'),
      chocks_on: get(row, 'in', 'on'),
      approaches: (function() {
        var apchList = [];
        var apch1 = get(row, 'approach_1', 'approach 1');
        var apch2 = get(row, 'approach_2', 'approach 2');
        [apch1, apch2].forEach(function(a) {
          if (!a) return;
          var parts = a.split(';');
          if (parts.length >= 2) {
            var rwy = parts[0] || '';
            var type = parts[1] || 'ILS';
            var apt = parts[2] || '';
            if (type === '- NON-PRECISION -') type = '2D (Non-Precision)';
            if (type === '- PRECISION -') type = '3D (Precision)';
            apchList.push({type: type, rwy: rwy, airport: apt, result: 'Full Stop'});
          }
        });
        return apchList;
      })(),
    });
  }
  return entries;
}


async function importEntries(entries) {
  const BATCH = 50;
  let imported = 0;
  for (let i = 0; i < entries.length; i += BATCH) {
    const batch = entries.slice(i, i + BATCH);
    const { data, error } = await sb.from('flights').insert(batch).select();
    if (error) throw error;
    state.flights = [...(data||[]), ...state.flights];
    imported += batch.length;
    document.getElementById('import-progress') && (document.getElementById('import-progress').textContent = `Imported ${imported} / ${entries.length}...`);
  }
  state.flights.sort((a,b) => b.date.localeCompare(a.date));
  return imported;
}

// ─── DOCUMENT UPLOAD ──────────────────────────────────────────────────────────
async function uploadDocument(file, docType, notes) {
  const uid = state.session.user.id;
  const path = `${uid}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;

  const { error: upErr } = await sb.storage.from('pilot-docs').upload(path, file);
  if (upErr) throw upErr;

  const { data, error } = await sb.from('documents').insert({
    pilot_id: uid, doc_type: docType, name: file.name,
    storage_path: path, file_size: file.size, mime_type: file.type, notes
  }).select().single();
  if (error) throw error;

  state.documents = [data, ...state.documents];
  toast('Document uploaded');
  render();
}

async function getDocUrl(path) {
  const { data } = await sb.storage.from('pilot-docs').createSignedUrl(path, 3600);
  return data?.signedUrl;
}

async function deleteDocument(doc) {
  if (!confirm('Delete this document?')) return;
  await sb.storage.from('pilot-docs').remove([doc.storage_path]);
  await sb.from('documents').delete().eq('id', doc.id);
  state.documents = state.documents.filter(d => d.id !== doc.id);
  toast('Deleted');
  render();
}

// ─── COMPUTED ─────────────────────────────────────────────────────────────────
function computeTotals(flights) {
  return flights.reduce((a, e) => {
    a.total += (e.total_time||0)+(e.sim_time||0);
    a.flight += (e.total_time||0);
    a.sim += (e.sim_time||0);
    a.pic += (e.pic||0);
    a.picus += (e.picus||0);
    a.sic += (e.sic||0);
    a.dual += (e.dual||0);
    a.solo += (e.solo||0);
    a.night += (e.night||0);
    a.ifr += (e.ifr||0);
    a.sim_inst += (e.sim_inst||0);
    a.xc += (e.xc||0);
    a.day_ldgs += (e.day_landings||0);
    a.night_ldgs += (e.night_landings||0);
    a.approaches += (e.approaches||[]).length;
    return a;
  }, {total:0,flight:0,sim:0,pic:0,picus:0,sic:0,dual:0,solo:0,night:0,ifr:0,sim_inst:0,xc:0,day_ldgs:0,night_ldgs:0,approaches:0});
}

function filteredFlights() {
  return state.flights.filter(f => {
    if (state.filterType && f.aircraft_type !== state.filterType) return false;
    if (state.filterRole && f.pilot_role !== state.filterRole) return false;
    if (state.searchQ) {
      const q = state.searchQ.toLowerCase();
      const hay = [f.aircraft_reg,f.aircraft_type,f.dep_airport,f.arr_airport,f.route,f.remarks,f.instructor,f.lesson].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

// ─── RENDER HELPERS ───────────────────────────────────────────────────────────
function el(tag, props={}, ...children) {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(props)) {
    if (k === 'onclick') e.onclick = v;
    else if (k === 'oninput') e.oninput = v;
    else if (k === 'onchange') e.onchange = v;
    else if (k === 'class') e.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null) continue;
    if (typeof c === 'string' || typeof c === 'number') e.appendChild(document.createTextNode(String(c)));
    else if (c instanceof Node) e.appendChild(c);
    else if (Array.isArray(c)) c.forEach(x => x instanceof Node && e.appendChild(x));
  }
  return e;
}
const div = (p,...c) => el('div',p,...c);
const span = (p,...c) => el('span',p,...c);
const btn = (p,...c) => el('button',p,...c);
const inp = (p) => el('input',p);
const sel = (p,...c) => el('select',p,...c);
const opt = (v,t,s) => { const o=el('option',{value:v},t||v); if(s) o.selected=true; return o; };

function statCard(label, value, unit='h', color='var(--sky)') {
  return div({class:'stat'},
    div({class:'stat-label'},label),
    div({class:'stat-value',style:{color}},
      typeof value === 'number' ? (unit==='h'?value.toFixed(1):Math.round(value)) : value,
      span({class:'stat-unit'},unit)
    )
  );
}

function pbar(current, req, color='var(--sky)') {
  const pct = Math.min(100, (current/req)*100);
  const done = current >= req;
  const wrap = div({class:'pbar-wrap', style:{marginTop:'4px'}});
  const fill = div({class:'pbar-fill', style:{width:pct+'%', background:done?'var(--green)':color}});
  wrap.appendChild(fill);
  return wrap;
}

function modal(title, content, onClose, wide=false) {
  const bg = div({class:'modal-bg', onclick: e => { if(e.target===bg) onClose(); }});
  const m = div({class:'modal', style:{maxWidth:wide?'700px':'520px'}});
  const head = div({class:'modal-head'},
    span({style:{fontWeight:800,fontSize:15,color:'var(--text)'}}, title),
    btn({class:'close-btn', onclick:onClose}, 'x')
  );
  const body = div({class:'modal-body'});
  body.appendChild(content);
  m.appendChild(head);
  m.appendChild(body);
  bg.appendChild(m);
  return bg;
}

function fieldGroup(label, input) {
  const wrap = div({class:'field'});
  wrap.appendChild(el('label',{},label));
  wrap.appendChild(input);

}

function numInp(val, onChange) {

}

// ─── IMPORT SCREEN ────────────────────────────────────────────────────────────
function renderImport() {
  let parsed = null;
  const content = div({});

  const info = div({style:{background:'var(--card)',border:'1px solid var(--border)',borderRadius:'8px',padding:'12px 14px',marginBottom:'14px',fontSize:'12px',color:'var(--steel)',lineHeight:'1.7'}});
  info.innerHTML = '<strong style="color:var(--text)">Supported formats:</strong><br>' +
    '- LogTen Pro: File > Export > Tab-delimited (.txt)<br>' +
    '- MyFlightbook: Export > CSV<br>' +
    '- Any tab-delimited or CSV logbook export<br><br>' +
    '<strong style="color:var(--amber)">Note:</strong> Duplicate detection is not automatic - avoid importing the same file twice.';
  content.appendChild(info);

  const zone = div({class:'upload-zone'});
  zone.innerHTML = '<div style="font-size:32px;margin-bottom:8px">+</div><div style="font-size:14px;color:var(--steel);margin-bottom:4px">Drop your logbook export here</div><div style="font-size:11px;color:var(--muted)">Tab-delimited .txt or .csv</div>';

  const fileInp = inp({type:'file',accept:'.txt,.csv,.tsv',style:{display:'none'}});
  fileInp.onchange = e => { if(e.target.files[0]) processFile(e.target.files[0]); };
  zone.onclick = () => fileInp.click();
  zone.ondragover = e => { e.preventDefault(); zone.classList.add('drag'); };
  zone.ondragleave = () => zone.classList.remove('drag');
  zone.ondrop = e => { e.preventDefault(); zone.classList.remove('drag'); if(e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]); };

  content.appendChild(zone);
  content.appendChild(fileInp);

  const preview = div({style:{marginTop:'12px'}});
  content.appendChild(preview);

  function processFile(file) {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        parsed = parseLogTenPro(e.target.result);
        preview.innerHTML = '';
        const ok = div({class:'ok'}, parsed.length + ' entries parsed from ' + file.name + '. Ready to import.');
        preview.appendChild(ok);
        const importBtn = btn({style:{background:'var(--green)',border:'none',color:'var(--gold)',borderRadius:'8px',padding:'10px 20px',fontSize:'14px',fontWeight:'700',cursor:'pointer',width:'100%'},
          onclick:async()=>{
            importBtn.disabled=true;
            importBtn.textContent='Importing...';
            preview.appendChild(div({id:'import-progress',style:{fontSize:'12px',color:'var(--steel)',marginTop:'8px',textAlign:'center'}},'Starting...'));
            try {
              const count = await importEntries(parsed);
              preview.innerHTML = '';
              preview.appendChild(div({class:'ok'},count+' entries imported successfully!'));
              setTimeout(()=>setState({showImport:false}), 2000);
            } catch(err) {
              preview.appendChild(div({class:'err'},'Import error: '+err.message));
              importBtn.disabled=false;
              importBtn.textContent='Try Again';
            }
          }
        },'Import ' + parsed.length + ' Entries');
        preview.appendChild(importBtn);
      } catch(e) {
        preview.innerHTML = '';
        preview.appendChild(div({class:'err'},'Parse error: '+e.message));
      }
    };
    reader.readAsText(file, 'utf-8');
  }

  return content;
}

    ld.appendChild(div({style:{color:'var(--steel)',fontFamily:'monospace',fontSize:'12px'}},'Loading...'));

    function pfld(label, key, type='text', placeholder='') {
      const w = div({class:'field'});
      w.appendChild(el('label',{},label));
      const i = inp({type, value:data[key]||'', placeholder, style:si3, oninput:e=>{data[key]=e.target.value;}});
      w.appendChild(i);
      return w;
    }
    const card = div({style:{background:'var(--card)',border:'1px solid var(--border)',borderRadius:'11px',padding:'18px 20px',maxWidth:'500px'}});
    card.appendChild(pfld('Full Name','full_name','text','Jaydon Durr'));
    card.appendChild(pfld('Licence Number','licence_number','text','ZA-PPL-12345'));
    const ltWrap = div({class:'field'});
    ltWrap.appendChild(el('label',{},'Licence Type'));
    const ltSel = sel({style:{...si3,cursor:'pointer'},onchange:e=>{data.licence_type=e.target.value;}});
    ['SPL','PPL','CPL','ATPL'].forEach(t=>ltSel.appendChild(opt(t,t,p.licence_type===t)));
    ltWrap.appendChild(ltSel);
    card.appendChild(ltWrap);
    const mcWrap = div({class:'field'});
    mcWrap.appendChild(el('label',{},'Medical Class'));
    const mcSel = sel({style:{...si3,cursor:'pointer'},onchange:e=>{data.medical_class=e.target.value;}});
    ['Class 1','Class 2','Class 3','Student'].forEach(t=>mcSel.appendChild(opt(t,t,p.medical_class===t)));
    mcWrap.appendChild(mcSel);
    card.appendChild(mcWrap);
    card.appendChild(pfld('Medical Expiry','medical_expiry','date'));
    card.appendChild(pfld('Phone','phone','text','+27 82 000 0000'));
    card.appendChild(pfld('ATO / Flight School','ato','text','FlySafair Training Centre'));
    card.appendChild(div({class:'field'},
      el('label',{},'Email'),
      inp({type:'email',value:state.session.user.email,disabled:true,style:{...si3,opacity:'0.5'}})
    ));
    card.appendChild(btn({class:'btn btn-primary',style:{marginTop:'8px'},onclick:async()=>{
      try{await saveProfile(data);}catch(e){toast('Error: '+e.message,'var(--red)');}
    }},'Save Profile'));
    main.appendChild(card);

    // Account info
    const acct = div({style:{background:'var(--card)',border:'1px solid var(--border)',borderRadius:'11px',padding:'14px 18px',maxWidth:'500px',marginTop:'16px'}});
    acct.appendChild(div({style:{fontSize:'10px',color:'var(--steel)',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:'10px'}},'Account Information'));
    [['Email',state.session.user.email],['Total Entries',state.flights.length],['Endorsements',state.endorsements.length],['Documents',state.documents.length],['Total Hours (all time)',totals.total.toFixed(1)+'h']].forEach(([l,v])=>{
      acct.appendChild(div({style:{display:'flex',justifyContent:'space-between',padding:'5px 0',borderBottom:'1px solid var(--border)22',fontSize:'12px'}},
        span({style:{color:'var(--steel)'}},l),span({style:{color:'var(--text)',fontFamily:'monospace'}},String(v))
      ));
    });
    main.appendChild(acct);
  }

  app.appendChild(main);

  // ── MODALS ─────────────────────────────────────────────────────────────────
  if (state.showFlightForm) {
    app.appendChild(modal(state.editFlight?'Edit Flight Entry':'New Flight Entry', renderFlightForm(state.editFlight), ()=>setState({showFlightForm:false,editFlight:null}), true));
  }

  if (state.showEndorseForm) {
    app.appendChild(modal(state.editEndorse?'Edit Endorsement':'New Endorsement', renderEndorseForm(state.editEndorse), ()=>setState({showEndorseForm:false,editEndorse:null})));
  }

  if (state.viewFlight) {
    const f = state.viewFlight;
    const ft = (f.total_time||0)+(f.sim_time||0);
    const content = div({});
    content.appendChild(div({style:{display:'flex',gap:'6px',marginBottom:'12px',flexWrap:'wrap'}},
      span({class:'badge',style:{background:'var(--sky)22',color:'var(--sky)',border:'1px solid var(--sky)33',padding:'3px 10px',fontSize:'12px',fontWeight:'700'}},fmtDate(f.date)),
      span({class:'badge',style:{background:'var(--card)',color:'var(--dim)',padding:'3px 10px',fontSize:'12px',border:'1px solid var(--border)'}},f.duty_type),
      f.flight_rules?span({class:'badge',style:{background:'var(--border)',color:'var(--steel)',padding:'3px 10px',fontSize:'12px'}},f.flight_rules):null
    ));
    content.appendChild(div({style:{background:'var(--bg)',borderRadius:'9px',padding:'12px 14px',marginBottom:'10px',border:'1px solid var(--border)'}},
      div({style:{fontSize:'18px',fontWeight:'900',color:'var(--sky)',fontFamily:'monospace'}},f.aircraft_reg||f.aircraft_type||'-'),
      div({style:{color:'var(--steel)',fontSize:'11px',marginTop:'2px'}},f.aircraft_type||''),
      (f.route||(f.dep_airport&&f.arr_airport))?div({style:{marginTop:'8px',fontSize:'14px',color:'var(--text)',fontFamily:'monospace',fontWeight:'700'}},f.route||(f.dep_airport+' -> '+f.arr_airport)):null
    ));
    const tgrid = div({style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'6px',marginBottom:'10px'}});
    [['Total',hhmm(ft),'var(--sky)'],['PIC',hhmm(f.pic||0),'var(--amber)'],['SIC',hhmm(f.sic||0),'var(--steel)'],['Dual',hhmm(f.dual||0),'var(--sky)'],['Night',hhmm(f.night||0),'#60A5FA'],['Sim Inst',hhmm(f.sim_inst||0),'var(--purple)'],['XC',hhmm(f.xc||0),'var(--teal)'],['IFR',hhmm(f.ifr||0),'var(--purple)']].forEach(([l,v,c])=>{
      tgrid.appendChild(div({style:{background:'var(--bg)',borderRadius:'5px',padding:'5px 7px',border:'1px solid var(--border)'}},
        div({style:{fontSize:'8px',color:'var(--muted)',marginBottom:'2px'}},l),
        div({style:{fontFamily:'monospace',color:c,fontWeight:'700',fontSize:'12px'}},v)
      ));
    });
    content.appendChild(tgrid);
    if((f.day_landings||0)+(f.night_landings||0)>0||(f.approaches||[]).length>0) {
      const mv = div({style:{display:'flex',gap:'7px',marginBottom:'10px',flexWrap:'wrap'}});
      if(f.day_takeoffs) mv.appendChild(div({style:{background:'var(--card)',borderRadius:'7px',padding:'5px 11px',textAlign:'center',border:'1px solid var(--border)'}},div({style:{fontSize:'9px',color:'var(--muted)'}},'Day T/O'),div({style:{fontFamily:'monospace',fontSize:'16px',color:'var(--green)',fontWeight:'800'}},f.day_takeoffs)));
      if(f.day_landings) mv.appendChild(div({style:{background:'var(--card)',borderRadius:'7px',padding:'5px 11px',textAlign:'center',border:'1px solid var(--border)'}},div({style:{fontSize:'9px',color:'var(--muted)'}},'Day Ldgs'),div({style:{fontFamily:'monospace',fontSize:'16px',color:'var(--green)',fontWeight:'800'}},f.day_landings)));
      if(f.night_takeoffs) mv.appendChild(div({style:{background:'var(--card)',borderRadius:'7px',padding:'5px 11px',textAlign:'center',border:'1px solid var(--border)'}},div({style:{fontSize:'9px',color:'var(--muted)'}},'Night T/O'),div({style:{fontFamily:'monospace',fontSize:'16px',color:'#60A5FA',fontWeight:'800'}},f.night_takeoffs)));
      if(f.night_landings) mv.appendChild(div({style:{background:'var(--card)',borderRadius:'7px',padding:'5px 11px',textAlign:'center',border:'1px solid var(--border)'}},div({style:{fontSize:'9px',color:'var(--muted)'}},'Night Ldgs'),div({style:{fontFamily:'monospace',fontSize:'16px',color:'#60A5FA',fontWeight:'800'}},f.night_landings)));
      (f.approaches||[]).forEach(a=>mv.appendChild(span({class:'badge',style:{background:'var(--sky)22',color:'var(--sky)',border:'1px solid var(--sky)33',padding:'4px 9px',fontSize:'11px',fontWeight:'600'}},a.type+' '+a.airport)));
      content.appendChild(mv);
    }
    if(f.instructor||f.pilot_role||f.duty_role||f.chocks_off) content.appendChild(div({style:{background:'var(--card)',borderRadius:'7px',padding:'8px 12px',marginBottom:'8px',border:'1px solid var(--border)',fontSize:'12px',color:'var(--steel)',display:'flex',flexWrap:'wrap',gap:'12px'}},
      f.pilot_role?span({},span({style:{color:'var(--muted)'}},'Role: '),span({style:{color:'var(--amber)',fontWeight:'700'}},f.pilot_role)):null,
      f.duty_role?span({},span({style:{color:'var(--muted)'}},'Duty: '),span({style:{color:'var(--gold)',fontWeight:'700'}},f.duty_role)):null,
      f.instructor?span({},span({style:{color:'var(--muted)'}},'Instr: '),span({style:{color:'var(--text)'}},f.instructor)):null,
      f.chocks_off?span({},span({style:{color:'var(--muted)'}},'Off Blocks: '),span({style:{color:'var(--text)',fontFamily:'monospace'}},f.chocks_off+' Z')):null,
      f.chocks_on?span({},span({style:{color:'var(--muted)'}},'On Blocks: '),span({style:{color:'var(--text)',fontFamily:'monospace'}},f.chocks_on+' Z')):null,
      f.pushback_time?span({},span({style:{color:'var(--muted)'}},'Pushback: '),span({style:{color:'var(--text)',fontFamily:'monospace'}},f.pushback_time+' Z')):null
    ));
    if(f.lesson) content.appendChild(div({style:{background:'var(--sky)11',borderRadius:'7px',padding:'8px 12px',marginBottom:'8px',border:'1px solid var(--sky)33',fontSize:'12px',color:'var(--sky)'}},'Lesson: '+f.lesson));
    if(f.remarks) content.appendChild(div({style:{background:'var(--bg)',borderRadius:'7px',padding:'9px 12px',marginBottom:'10px',fontSize:'12px',color:'var(--steel)',lineHeight:'1.6',borderLeft:'3px solid var(--green)',border:'1px solid var(--border)',borderLeftColor:'var(--green)'}},f.remarks));
    const brow = div({style:{display:'flex',gap:'8px',justifyContent:'flex-end',paddingTop:'10px',borderTop:'1px solid var(--border)'}});
    brow.appendChild(btn({style:{background:'none',border:'1px solid var(--red)',color:'var(--red)',borderRadius:'7px',padding:'7px 14px',fontSize:'12px',cursor:'pointer'},onclick:()=>deleteFlight(f.id)},'Delete'));
    brow.appendChild(btn({style:{background:'var(--green)',border:'none',color:'var(--gold)',borderRadius:'7px',padding:'7px 14px',fontSize:'12px',fontWeight:'700',cursor:'pointer'},onclick:()=>{setState({viewFlight:null,editFlight:f,showFlightForm:true});}},'Edit'));
    content.appendChild(brow);
    app.appendChild(modal('Flight Detail', content, ()=>setState({viewFlight:null})));
  }

  if (state.showDocUpload) {
    const docTypes = [['medical','Medical Certificate'],['licence','Licence / Certificate'],['endorsement_scan','Endorsement Scan'],['logbook_page','Logbook Page'],['other','Other']];
    let selType = 'other'; let notes = '';
    const content2 = div({});
    const zone2 = div({class:'upload-zone',style:{marginBottom:'12px'}});
    zone2.innerHTML = '<div style="font-size:28px;margin-bottom:6px">+</div><div style="font-size:13px;color:var(--steel);margin-bottom:3px">Click or drop file here</div><div style="font-size:11px;color:var(--muted)">PDF, JPG, PNG - max 10MB</div>';
    const fileInp2 = inp({type:'file',accept:'.pdf,.jpg,.jpeg,.png,.gif,.heic,.webp',style:{display:'none'}});
    const preview2 = div({});
    const si4 = {width:'100%',background:'var(--bg)',border:'1px solid var(--border)',borderRadius:'7px',padding:'8px 12px',color:'var(--text)',fontSize:'13px',fontFamily:'inherit',marginBottom:'10px'};
    const dtSel = sel({style:{...si4,cursor:'pointer',display:'block'},onchange:e=>{selType=e.target.value;}});
    docTypes.forEach(([v,t])=>dtSel.appendChild(opt(v,t,false)));
    const ntInp = inp({type:'text',placeholder:'Notes (optional)',style:{...si4},oninput:e=>{notes=e.target.value;}});
    fileInp2.onchange = async e => {
      if(!e.target.files[0]) return;
      const file = e.target.files[0];
      if(file.size > 10*1024*1024) { preview2.innerHTML=''; preview2.appendChild(div({class:'err'},'File too large (max 10MB)')); return; }
      preview2.innerHTML='';
      const pb = div({class:'ok'},'Uploading '+file.name+'...');
      preview2.appendChild(pb);
      try {
        await uploadDocument(file, selType, notes);
        pb.textContent = 'Uploaded successfully!';
        setTimeout(()=>setState({showDocUpload:false}),1500);
      } catch(err) {
        preview2.innerHTML=''; preview2.appendChild(div({class:'err'},'Upload error: '+err.message));
      }
    };
    zone2.onclick = ()=>fileInp2.click();
    zone2.ondragover = e=>{e.preventDefault();zone2.classList.add('drag');};
    zone2.ondragleave = ()=>zone2.classList.remove('drag');
    zone2.ondrop = e=>{e.preventDefault();zone2.classList.remove('drag');fileInp2.files=e.dataTransfer.files;fileInp2.onchange({target:{files:e.dataTransfer.files}});};
    content2.appendChild(div({class:'field'},el('label',{},'Document Type'),dtSel));
    content2.appendChild(div({class:'field'},el('label',{},'Notes'),ntInp));
    content2.appendChild(zone2);
    content2.appendChild(fileInp2);
    content2.appendChild(preview2);
    app.appendChild(modal('Upload Document', content2, ()=>setState({showDocUpload:false})));
  }
}

// Boot
render();
</script>
</body>
</html>
