<!DOCTYPE html>
<!-- SALOGBOOK v1.0 - Springbok Aviation Logbook - Multi-user SACAA Compliant -->
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="SALOGBOOK"/>
  <meta name="theme-color" content="#FFFFFF"/>
  <title>SALOGBOOK - Springbok Aviation Logbook</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23006B3F'/><text y='.9em' font-size='65' x='10'>SB</text></svg>"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent
    :root{
      --bg:#F8F9FA;--surf:#FFFFFF;--card:#FFFFFF;--border:#DEE2E6;
      --green:#006B3F;--gold:#B8860B;--red:#DC3545;--blue:#0066CC;
      --sky:#0066CC;--purple:#6F42C1;--amber:#B8860B;--teal:#0D6E6E;
      --text:#1A1A1A;--dim:#333333;--steel:#555555;--muted:#888888;
    }
    body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%;min-height:100vh}
    #app{min-height:100vh}
    /* Auth screen */
    .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#E8F0F8,#F0F7FF)}
    .auth-card{background:var(--surf);border:1px solid var(--border);border-radius:14px;padding:32px 28px;width:100%;max-width:400px}
    .auth-logo{display:flex;align-items:center;gap:12px;margin-bottom:28px}
    .auth-icon{width:48px;height:48px;border-radius:11px;background:#006B3F;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#FFB612;letter-spacing:-1px}
    .auth-title{font-size:20px;font-weight:800;color:var(--text)}
    .auth-sub{font-size:11px;color:var(--steel);margin-top:2px}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:10px;color:var(--steel);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
    .field input,.field select,.field textarea{width:100%;background:#FFFFFF;border:1px solid #CED4DA;border-radius:6px;padding:9px 12px;color:#1A1A1A;font-size:14px;outline:none;font-family:inherit;transition:border-color .15s}
    .field input:focus,.field select:focus{border-color:#0066CC;box-shadow:0 0 0 2px rgba(0,102,204,.1)}
    .btn{width:100%;padding:11px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s}
    .btn-primary{background:var(--green);color:var(--gold)}
    .btn-secondary{background:var(--card);color:var(--steel);border:1px solid var(--border)}
    .btn:hover{opacity:.9}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .err{background:#E8334A22;border:1px solid #E8334A55;border-radius:6px;padding:9px 12px;font-size:12px;color:#F87171;margin-bottom:12px}
    .ok{background:#006B3F22;border:1px solid #006B3F55;border-radius:6px;padding:9px 12px;font-size:12px;color:#4ADE80;margin-bottom:12px}
    /* Main app */
    .header{background:#FFFFFF;border-bottom:2px solid #0066CC;padding:0 16px;position:sticky;top:0;z-index:100}
    .header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:52px}
    .hlogo{display:flex;align-items:center;gap:9px}
    .hicon{width:34px;height:34px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:var(--gold)}
    .tabs{display:flex;overflow-x:auto;border-top:1px solid #DEE2E6;background:#FFFFFF}
    .tabs::-webkit-scrollbar{display:none}
    .tab{background:none;border:none;color:#555555;padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;font-family:inherit}
    .tab.active{color:#0066CC;font-weight:700;border-bottom-color:#0066CC}
    .main{max-width:1100px;margin:0 auto;padding:14px}
    /* Stat card */
    .stat{background:#FFFFFF;border:1px solid #DEE2E6;border-radius:6px;padding:9px 13px;min-width:90px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    .stat-label{font-size:9px;color:#888888;text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px;font-weight:600}
    .stat-value{font-family:monospace;font-size:18px;font-weight:800;line-height:1}
    .stat-unit{font-size:9px;color:var(--muted);font-weight:400;margin-left:2px}
    /* Table */
    .tbl{width:100%;border-collapse:collapse;font-size:12px;background:white}
    .tbl th{padding:6px 8px;color:#FFFFFF;background:#0066CC;text-align:left;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid #004499}
    .tbl td{padding:7px 8px;border-bottom:1px solid #DEE2E6;vertical-align:middle;color:#1A1A1A}
    .tbl tr:hover td{background:#E8F0F8;cursor:pointer}
    .tbl tfoot td{padding:6px 8px;font-weight:700;border-top:2px solid #006B3F;background:#F0F7F4;font-family:monospace;color:#006B3F}
    /* Modals */
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:500;display:flex;align-items:center;justify-content:center;padding:12px}
    .modal{background:#FFFFFF;border:1px solid #DEE2E6;border-radius:10px;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;box-shadow:0 4px 24px rgba(0,0,0,.15)}
    .modal-head{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:2px solid #0066CC;position:sticky;top:0;background:#FFFFFF;z-index:2}
    .modal-body{padding:16px 18px}
    .close-btn{background:none;border:none;color:var(--steel);font-size:20px;cursor:pointer;padding:2px 6px;border-radius:4px}
    .close-btn:hover{background:var(--card)}
    /* Progress bar */
    .pbar-wrap{background:#E9ECEF;border-radius:4px;height:6px;overflow:hidden;border:1px solid #DEE2E6}
    .pbar-fill{height:100%;border-radius:4px;transition:width .6s ease}
    /* Badges */
    .badge{border-radius:4px;padding:2px 7px;font-size:10px;font-weight:600;display:inline-block}
    /* Toast */
    .toast{position:fixed;bottom:24px;right:16px;background:var(--green);color:var(--gold);padding:11px 18px;border-radius:9px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.4);animation:fadeup .3s ease}
    @keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    /* Upload zone */
    .upload-zone{border:2px dashed #ADB5BD;border-radius:9px;padding:24px;text-align:center;cursor:pointer;transition:border-color .2s;background:#FAFBFC}
    .upload-zone:hover,.upload-zone.drag{border-color:#0066CC;background:#E8F0F8}
    /* Scrollbar */
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-track{background:#F8F9FA}
    ::-webkit-scrollbar-thumb{background:#ADB5BD;border-radius:2px}
    @supports(padding:max(0px)){body{padding-bottom:env(safe-area-inset-bottom)}}
    @media print{
      .header,.tabs,.btn,button,.modal-bg{display:none!important}
      body,*{background:white!important;color:black!important;border-color:#ccc!important}
      .tbl{font-size:8pt!important}
      .tbl th,.tbl td{border:1px solid #ddd!important;padding:3px 5px!important}
    }
  </style>

const hhmm = h => { if(!h && h!==0) return '-'; if(h===0) return '0:00'; const hh=Math.floor(h),mm=Math.round((h-hh)*60); return hh+':'+String(mm).padStart(2,'0'); };

// ─── SOLAR POSITION / NIGHT TIME ───────────────────────────────────────────────
// Low-precision solar position formula (good to ~0.01 deg - far more than needed
// to classify day vs. night). "Night" is taken as the sun more than 6 deg below
// the horizon (civil twilight), the ICAO Annex 1 definition - double-check this
// matches SACAA's definition for your purposes before relying on it for currency.
function solarElevationDeg(date, latDeg, lonDeg) {
  const rad = Math.PI / 180;
  const jd = date.getTime() / 86400000 + 2440587.5;
  const d = jd - 2451545.0;
  const g = ((357.529 + 0.98560028 * d) % 360 + 360) % 360;
  const q = ((280.459 + 0.98564736 * d) % 360 + 360) % 360;
  const L = ((q + 1.915 * Math.sin(g * rad) + 0.020 * Math.sin(2 * g * rad)) % 360 + 360) % 360;
  const e = 23.439 - 0.00000036 * d;
  const RA = Math.atan2(Math.cos(e * rad) * Math.sin(L * rad), Math.cos(L * rad)) / rad;
  const decl = Math.asin(Math.sin(e * rad) * Math.sin(L * rad)) / rad;
  let GMST = (6.697375 + 0.0657098242 * d + date.getUTCHours() + date.getUTCMinutes() / 60 + date.getUTCSeconds() / 3600) % 24;
  if (GMST < 0) GMST += 24;
  let LMST = ((GMST + lonDeg / 15) % 24 + 24) % 24;
  let HA = LMST * 15 - RA;
  HA = ((HA + 180) % 360 + 360) % 360 - 180;
  const latRad = latDeg * rad, declRad = decl * rad, haRad = HA * rad;
  const sinElev = Math.sin(latRad) * Math.sin(declRad) + Math.cos(latRad) * Math.cos(declRad) * Math.cos(haRad);
  return Math.asin(Math.max(-1, Math.min(1, sinElev))) / rad;
}

// Great-circle interpolation (slerp) between two lat/lon points, t in [0,1]
function _llToVec(lat, lon) {
  const r = Math.PI / 180;
  return [Math.cos(lat * r) * Math.cos(lon * r), Math.cos(lat * r) * Math.sin(lon * r), Math.sin(lat * r)];
}
function _vecToLL(v) {
  const r = 180 / Math.PI;
  return [Math.asin(Math.max(-1, Math.min(1, v[2]))) * r, Math.atan2(v[1], v[0]) * r];
}
function _slerp(v0, v1, omega, t) {
  if (omega < 1e-9) return v0;
  const s0 = Math.sin((1 - t) * omega) / Math.sin(omega), s1 = Math.sin(t * omega) / Math.sin(omega);
  return [v0[0]*s0+v1[0]*s1, v0[1]*s0+v1[1]*s1, v0[2]*s0+v1[2]*s1];
}

// Estimate night hours (civil twilight) for a flight between two airports,
// given the chocks-off/chocks-on Zulu times and total block hours. Returns
// null (leave existing value alone) if either airport's coordinates are
// unknown or the times don't parse.
function computeNightHours(depIcao, arrIcao, dateStr, offStr, onStr, blockHours) {
  const dep = AIRPORT_COORDS[depIcao], arr = AIRPORT_COORDS[arrIcao];
  if (!dep || !arr || !dateStr || !offStr || !onStr || !blockHours) return null;
  const dp = dateStr.split('-').map(Number), op = offStr.split(':').map(Number), np = onStr.split(':').map(Number);
  if (dp.length < 3 || op.length < 2 || np.length < 2) return null;
  let depMs = Date.UTC(dp[0], dp[1]-1, dp[2], op[0], op[1], 0);
  let arrMs = Date.UTC(dp[0], dp[1]-1, dp[2], np[0], np[1], 0);
  if (arrMs <= depMs) arrMs += 86400000; // crossed midnight
  const totalMs = arrMs - depMs;
  if (totalMs <= 0 || totalMs > 36 * 3600000) return null; // sanity cap ~36h
  const N = Math.min(120, Math.max(12, Math.round(totalMs / 300000))); // ~every 5 min
  const v0 = _llToVec(dep[0], dep[1]), v1 = _llToVec(arr[0], arr[1]);
  const dot = Math.max(-1, Math.min(1, v0[0]*v1[0]+v0[1]*v1[1]+v0[2]*v1[2]));
  const omega = Math.acos(dot);
  let nightCount = 0;
  for (let i = 0; i < N; i++) {
    const t = (i + 0.5) / N;
    const ms = depMs + t * totalMs;
    const [lat, lon] = _vecToLL(_slerp(v0, v1, omega, t));
    if (solarElevationDeg(new Date(ms), lat, lon) < -6) nightCount++;
  }
  return Math.round(blockHours * (nightCount / N) * 10) / 10;
}

// ─── AUTH ─────────────────────────────────────────────────────────────────────
// Remember who was last signed in (uid + email only - no password/token) so that
// a fully offline cold launch - or a launch where Supabase's own session refresh
// can't reach the network - can still recognise the pilot and serve their cached
// IndexedDB data, instead of dead-ending on the login screen with no way to
// "sign in" offline at all.
function cacheLastIdentity(session) {
  try {
    localStorage.setItem('salogbook_last_identity', JSON.stringify({uid: session.user.id, email: session.user.email}));
  } catch(e) {}
}
function getCachedIdentity() {
  try {
    const raw = localStorage.getItem('salogbook_last_identity');
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}
let _authSettled = false;
sb.auth.onAuthStateChange(async (event, session) => {
  _authSettled = true;
  if (session) {
    state.session = session;
    cacheLastIdentity(session);
    await loadProfile();
    await loadAll();
  } else if (!navigator.onLine && getCachedIdentity()) {
    // No live session (it may simply have expired while offline and the
    // refresh call has nowhere to go) but we recognise this device/pilot and
    // have their data cached locally - use it rather than blocking them out.
    const cached = getCachedIdentity();
    state.session = { user: { id: cached.uid, email: cached.email }, offline: true };
    state.profile = state.profile || { id: cached.uid, full_name: '', licence_type: 'SPL' };
    await loadAll();
  } else {
    state.session = null;
    state.profile = null; state.flights = []; state.endorsements = []; state.documents = [];

async function loadProfile() {

async function loadAll() {
  const uid = state.session.user.id;
  if (!isOnline) {
    // Load from local IndexedDB cache
    const [flights, endorsements] = await Promise.all([
      idbGetAll('flights'),
      idbGetAll('endorsements'),
    ]);
    state.flights = flights.filter(f => f.pilot_id === uid).sort((a,b) => b.date.localeCompare(a.date));
    state.endorsements = endorsements.filter(e => e.pilot_id === uid);
    state.documents = [];
    return;
  }

  // Fetch ALL flights using pagination (Supabase default limit is 1000 rows)
  async function fetchAll(table, orderCol, ascending) {
    const PAGE = 1000;
    let all = [];
    let from = 0;
    while (true) {
      const { data, error } = await sb.from(table).select('*')
        .eq('pilot_id', uid)
        .order(orderCol, {ascending})
        .range(from, from + PAGE - 1);
      if (error || !data || data.length === 0) break;
      all = all.concat(data);
      if (data.length < PAGE) break; // last page
      from += PAGE;
    }
    return all;
  }

  const [flights, endorsements, documents] = await Promise.all([
    fetchAll('flights', 'date', false),
    fetchAll('endorsements', 'date_issued', false),
    fetchAll('documents', 'created_at', false),
  ]);

  state.flights = flights;
  state.endorsements = endorsements;
  state.documents = documents;

  // Cache locally for offline use
  await Promise.all([
    idbPutAll('flights', state.flights),
    idbPutAll('endorsements', state.endorsements),
  ]);
}

async function saveFlight(data) {
  const uid = state.session.user.id;
  if (!isOnline) {
    // Save locally and queue for sync
    const localEntry = {...data, pilot_id: uid, updated_at: new Date().toISOString()};
    if (data.id && !data.id.startsWith('new')) {
      state.flights = state.flights.map(f => f.id === data.id ? localEntry : f);
      await idbPutAll('flights', [localEntry]);
      await idbQueueAdd({action: 'update', table: 'flights', data: localEntry});
    } else {
      localEntry.id = 'offline_' + Date.now();
      localEntry.source = 'manual';
      state.flights = [localEntry, ...state.flights];
      await idbPutAll('flights', [localEntry]);
      await idbQueueAdd({action: 'insert', table: 'flights', data: localEntry});
    }
    state.flights.sort((a,b) => b.date.localeCompare(a.date));
    toast('Saved offline - will sync when connected', 'var(--amber)');
    _flightDraftActive = false; _flightDraftData = null;
    setState({ showFlightForm: false, editFlight: null });
    return;
  }
  if (data.id && !data.id.startsWith('new')) {
    const { error } = await sb.from('flights').update({...data, updated_at: new Date().toISOString()}).eq('id', data.id);
    if (error) throw error;
    state.flights = state.flights.map(f => f.id === data.id ? {...f, ...data} : f);
    await idbPutAll('flights', [data]);
  } else {
    const { id: _id, ...rest } = data;
    const { data: inserted, error } = await sb.from('flights').insert({...rest, pilot_id: uid}).select().single();
    if (error) throw error;
    state.flights = [inserted, ...state.flights];
    await idbPutAll('flights', [inserted]);
  }
  state.flights.sort((a,b) => b.date.localeCompare(a.date));
  toast('Flight saved');
  _flightDraftActive = false; _flightDraftData = null;
  setState({ showFlightForm: false, editFlight: null });
}

async function deleteFlight(id) {

async function saveEndorsement(data) {
  const uid = state.session.user.id;
  // Postgres `date` columns reject '' (only accept a real date or NULL) - blank
  // date fields (e.g. an endorsement with no expiry, or a submitted_date that
  // was never set) must be sent as null, not empty string, or the save fails
  // with "invalid input syntax for type date".
  const payload = {...data};
  ['date_issued','expiry_date','submitted_date'].forEach(k => { if (payload[k] === '') payload[k] = null; });
  if (payload.id) {
    const { error } = await sb.from('endorsements').update({...payload, updated_at: new Date().toISOString()}).eq('id', payload.id);
    if (error) throw error;
    state.endorsements = state.endorsements.map(e => e.id === payload.id ? {...e, ...payload} : e);  } else {
    const { data: ins, error } = await sb.from('endorsements').insert({...payload, pilot_id: uid}).select().single();
    if (error) throw error;
    state.endorsements = [ins, ...state.endorsements];
  }
  toast('Endorsement saved');
  setState({ showEndorseForm: false, editEndorse: null });
}

async function deleteEndorsement(id) {

async function saveProfile(data) {

function parseLogTenPro(text) {
  const lines = text.split('\n').filter(l => l.trim());
  if (lines.length < 2) throw new Error('No data found');

  // Detect format by checking headers
  const firstLine = lines[0].replace(/^﻿/, ''); // remove BOM
  const isCSV = firstLine.includes('"Date"') || firstLine.includes('Date,');
  
  if (isCSV) {
    return parseMyFlightbook(lines);
  } else {
    return parseTabDelimited(lines);
  }
}

function parseMyFlightbook(lines) {
  // Parse CSV with quoted fields
  function parseCSVLine(line) {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        inQuotes = !inQuotes;
      } else if (ch === ',' && !inQuotes) {
        result.push(current.trim());
        current = '';
      } else {
        current += ch;
      }
    }
    result.push(current.trim());
    return result;
  }

  const headerLine = lines[0].replace(/^﻿/, '').replace(/"/g, '');
  const headers = headerLine.split(',').map(h => h.trim().toLowerCase());

  function idx(name) {
    return headers.findIndex(h => h === name.toLowerCase() || h.includes(name.toLowerCase()));
  }

  const entries = [];
  for (let i = 1; i < lines.length; i++) {
    const row = parseCSVLine(lines[i]);
    if (row.length < 3) continue;

    const get = (name) => {
      const i2 = idx(name);
      return i2 >= 0 ? (row[i2] || '').trim() : '';
    };
    const getNum = (name) => parseFloat(get(name)) || 0;
    const getHHMM = (name) => {
      const v = get(name);
      if (!v) return 0;
      if (v.includes(':')) {
        const [h, m] = v.split(':');
        return parseInt(h) + parseInt(m) / 60;
      }
      return parseFloat(v) || 0;
    };

    const dateRaw = get('date');
    if (!dateRaw) continue;

    // Parse date YYYY-MM-DD
    let date = dateRaw;
    if (dateRaw.match(/^\d{1,2}\/\d{1,2}\/\d{4}$/)) {
      const [m, d, y] = dateRaw.split('/');
      date = y + '-' + m.padStart(2, '0') + '-' + d.padStart(2, '0');
    }

    const totalTime = getHHMM('total flight time (hh:mm)') || getNum('total flight time');
    const simTime = getNum('ground simulator');
    const dual = getNum('dual received');
    const pic = getNum('pic');
    const night = getNum('night');
    const simInst = getNum('simulated instrument');
    const imc = getNum('imc');
    const xc = getNum('x-country');
    const solo = getNum('solo time');
    const dayLdgs = parseInt(getNum('fs day landings')) || 0;
    const nightLdgs = parseInt(getNum('fs night landings')) || 0;
    const approaches = parseInt(getNum('approaches')) || 0;
    const holds = get('hold').toLowerCase() === 'yes' ? 1 : 0;

    // Parse route
    const route = get('route');
    const airports = route.replace(/-/g, ' ').split(' ').filter(a => a.match(/^[A-Z]{2,4}$/));
    const dep = airports[0] || '';
    const arr = airports[airports.length - 1] || dep;

    // Parse instructor from Flight Properties
    const props = get('flight properties');
    const instrMatch = props.match(/Instructor:\s*([^;]+)/i);
    const instructor = instrMatch ? instrMatch[1].trim() : get('instructor name') || get('cfi name');
    const lesson = get('lesson # / description') || get('comments');
    const picName = get('name of pic') || 'J. Durr';

    const isSim = simTime > 0 && totalTime === 0;
    const apchList = [];
    if (approaches > 0 && arr) {
      for (let j = 0; j < Math.min(approaches, 5); j++) {
        apchList.push({ type: 'ILS Cat I', rwy: '', airport: arr, result: 'Full Stop' });
      }
    }

    let role = 'Dual (Student)';
    if (isSim) role = 'Student / Trainee';
    else if (solo > 0 && dual === 0) role = 'PIC (Solo)';
    else if (pic > 0 && dual === 0 && !instructor) role = 'PIC';

    entries.push({
      pilot_id: state.session.user.id,
      date,
      source: 'myflightbook',
      duty_type: isSim ? 'Simulator Duty' : 'Flight Duty',
      flight_rules: (imc > 0 || simInst > 0 || approaches > 0) ? 'IFR' : 'VFR',
      aircraft_type: get('icao model') || get('model') || '',
      aircraft_reg: get('tail number') || '',
      dep_airport: dep,
      arr_airport: arr,
      route: route,
      total_time: isSim ? 0 : totalTime,
      sim_time: simTime || (isSim ? totalTime : 0),
      pic: pic,
      sic: getNum('sic'),
      picus: 0,
      dual: dual,
      solo: solo,
      night: night,
      ifr: imc,
      sim_inst: simInst,
      xc: xc,
      day_landings: dayLdgs,
      night_landings: nightLdgs,
      holds: holds,
      approaches: apchList,
      pilot_role: role,
      p1_name: picName,
      p2_name: instructor ? 'J. Durr' : '',
      instructor: instructor,
      lesson: lesson,
      remarks: get('comments'),
    });
  }
  return entries;
}

function parseTabDelimited(lines) {
  // Column names below match LogTenPro's TSV export headers exactly (normalized to
  // lowercase with spaces/slashes collapsed to underscores), tried first for an exact
  // match before falling back to a fuzzy substring match for other export formats.
  const headers = lines[0].split('\t').map(h => h.trim().toLowerCase().replace(/[\s\/]+/g, '_'));

  const get = (row, ...names) => {
    for (const n of names) {
      let i = headers.indexOf(n);
      if (i < 0) i = headers.findIndex(h => h.includes(n));
      if (i >= 0 && row[i]) return row[i].trim();
    }
    return '';
  };
  const getNum = (row, ...names) => parseFloat(get(row, ...names)) || 0;
  const getHHMM = (row, ...names) => {
    const v = get(row, ...names);
    if (!v) return 0;
    if (v.includes(':')) {
      const parts = v.split(':');
      return parseInt(parts[0]) + parseInt(parts[1] || 0) / 60;
    }
    return parseFloat(v) || 0;
  };
  const getBool = (row, ...names) => {
    const v = get(row, ...names).toLowerCase();
    return v === '1' || v === 'true' || v === 'yes' || v === 'x';
  };

  const entries = [];
  for (let i = 1; i < lines.length; i++) {
    const row = lines[i].split('\t');
    if (row.length < 3) continue;
    const dateRaw = get(row, 'date');
    if (!dateRaw) continue;

    let date = dateRaw;
    if (dateRaw.match(/^\d{1,2}\/\d{1,2}\/\d{4}$/)) {
      const [m, d, y] = dateRaw.split('/');
      date = y + '-' + m.padStart(2, '0') + '-' + d.padStart(2, '0');
    } else if (dateRaw.match(/^\d{4}-\d{2}-\d{2}/)) {
      date = dateRaw.slice(0, 10);
    }

    const totalTime = getHHMM(row, 'total_time', 'flight_time', 'total', 'block');
    const simTime = getHHMM(row, 'simulator', 'sim', 'ground');
    if (totalTime === 0 && simTime === 0) continue;
    // LogTenPro exports legacy "carry-forward" aggregate rows with implausible totals - skip them
    if (totalTime > 24) continue;

    const picHours = getHHMM(row, 'pic', 'pilot_in_command');
    const dualRcvdHours = getHHMM(row, 'dual_rcvd', 'dual_received', 'dual');
    const checkCaptainName = get(row, 'check_captain');
    const instructorName = get(row, 'instructor', 'instructor_name');

    // PIC/SIC assignment: if this flight's own Check Captain or Instructor field is
    // filled, the pilot was acting in that capacity (LogTenPro often leaves the PIC
    // column blank for instructing/checking flights) - credit the time as PIC.
    let pilot_role, picValue = picHours;
    if (checkCaptainName) {
      pilot_role = 'Check Captain';
      if (picValue === 0) picValue = totalTime;
    } else if (instructorName) {
      pilot_role = 'Training Captain';
      if (picValue === 0) picValue = totalTime;
    } else if (picHours > 0) {
      pilot_role = 'PIC';
    } else if (dualRcvdHours > 0) {
      pilot_role = 'Dual (Student)';
    } else {
      pilot_role = 'SIC';
    }

    const apchList = [];
    const apch1 = get(row, 'approach_1');
    const apch2 = get(row, 'approach_2');
    [apch1, apch2].forEach(a => {
      if (!a) return;
      const parts = a.split(';');
      if (parts.length >= 2) {
        let type = parts[1] || 'ILS';
        if (type === '- NON-PRECISION -') type = '2D (Non-Precision)';
        if (type === '- PRECISION -') type = '3D (Precision)';
        apchList.push({ type, rwy: parts[0] || '', airport: parts[2] || '', result: 'Full Stop' });
      }
    });

    entries.push({
      pilot_id: state.session.user.id,
      date, source: 'logten',
      duty_type: simTime > 0 && totalTime === 0 ? 'Simulator Duty' : 'Flight Duty',
      flight_rules: getNum(row, 'actual_inst', 'imc') > 0 ? 'IFR' : 'VFR',
      flight_number: get(row, 'flight_#', 'flight_no', 'flight_number'),
      aircraft_type: get(row, 'aircraft_type', 'type', 'model', 'icao'),
      aircraft_reg: get(row, 'aircraft_id', 'registration', 'tail', 'reg'),
      dep_airport: get(row, 'from', 'departure', 'origin'),
      arr_airport: get(row, 'to', 'arrival', 'destination'),
      route: get(row, 'route'),
      chocks_off: get(row, 'out', 'off'),
      chocks_on: get(row, 'in'),
      on_duty: get(row, 'on_duty'),
      off_duty: get(row, 'off_duty'),
      total_time: totalTime,
      sim_time: simTime,
      night: getHHMM(row, 'night'),
      actual_inst: getHHMM(row, 'actual_inst'),
      ifr: getHHMM(row, 'ifr'),
      sim_inst: getHHMM(row, 'sim_inst', 'simulated_instrument'),
      xc: getHHMM(row, 'xc', 'cross_country', 'x_country'),
      pic: picValue,
      sic: getHHMM(row, 'sic', 'second_in_command', 'co_pilot'),
      picus: getHHMM(row, 'picus', 'pic_us'),
      dual: dualRcvdHours,
      dual_given: getHHMM(row, 'dual_given'),
      solo: getHHMM(row, 'solo'),
      p1us: getHHMM(row, 'p1u_s'),
      p1us_night: getHHMM(row, 'p1u_s_night'),
      relief: getHHMM(row, 'relief'),
      sfi_sfe: getHHMM(row, 'sfi_sfe'),
      pilot_flying: getBool(row, 'pilot_flying'),
      p1_name: get(row, 'pic_p1_crew', 'pic_name', 'captain', 'p1'),
      p2_name: get(row, 'sic_p2_crew', 'co_pilot_name', 'sic_name', 'p2'),
      relief_crew_name: get(row, 'relief_crew'),
      instructor: instructorName,
      check_captain_name: checkCaptainName,
      pilot_role,
      day_takeoffs: parseInt(getNum(row, 'day_t_o', 'day_to')) || 0,
      night_takeoffs: parseInt(getNum(row, 'night_t_o', 'night_to')) || 0,
      day_landings: parseInt(getNum(row, 'day_ldg')) || 0,
      night_landings: parseInt(getNum(row, 'night_ldg')) || 0,
      autolands: parseInt(getNum(row, 'autolands')) || 0,
      catii: parseInt(getNum(row, 'catii')) || 0,
      catiii: parseInt(getNum(row, 'catiii')) || 0,
      rnav_approaches: parseInt(getNum(row, 'rnav')) || 0,
      ils_approaches: parseInt(getNum(row, 'ils')) || 0,
      holds: parseInt(getNum(row, 'holds', 'holding')) || 0,
      lesson: get(row, 'lesson', 'exercise', 'topic'),
      remarks: get(row, 'remarks', 'comments', 'notes'),
      approaches: apchList,
    });
  }
  return entries;
}


async function importEntries(entries) {
  const BATCH = 50;
  let imported = 0;
  for (let i = 0; i < entries.length; i += BATCH) {
    const batch = entries.slice(i, i + BATCH);
    const { data, error } = await sb.from('flights').insert(batch).select();
    if (error) throw error;
    state.flights = [...(data||[]), ...state.flights];
    imported += batch.length;
    document.getElementById('import-progress') && (document.getElementById('import-progress').textContent = `Imported ${imported} / ${entries.length}...`);
  }
  state.flights.sort((a,b) => b.date.localeCompare(a.date));
  return imported;
}// ─── DOCUMENT UPLOAD ──────────────────────────────────────────────────────────
async function uploadDocument(file, docType, notes) {
  const uid = state.session.user.id;
  const path = `${uid}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;

  const { error: upErr } = await sb.storage.from('pilot-docs').upload(path, file);
  if (upErr) throw upErr;

  const { data, error } = await sb.from('documents').insert({
    pilot_id: uid, doc_type: docType, name: file.name,
    storage_path: path, file_size: file.size, mime_type: file.type, notes
  }).select().single();
  if (error) throw error;

  state.documents = [data, ...state.documents];
  toast('Document uploaded');
  render();
}

async function getDocUrl(path) {
  const { data } = await sb.storage.from('pilot-docs').createSignedUrl(path, 3600);
  return data?.signedUrl;
}

async function deleteDocument(doc) {
  if (!confirm('Delete this document?')) return;
  await sb.storage.from('pilot-docs').remove([doc.storage_path]);
  await sb.from('documents').delete().eq('id', doc.id);
  state.documents = state.documents.filter(d => d.id !== doc.id);
  toast('Deleted');
  render();
}

// ─── COMPUTED ─────────────────────────────────────────────────────────────────
function computeTotals(flights) {
  const t = flights.reduce((a, e) => {
    a.total += (e.total_time||0)+(e.sim_time||0);
    a.flight += (e.total_time||0);
    a.sim += (e.sim_time||0);
    a.sfi_sfe += (e.sfi_sfe||0);
    a.sim_student += Math.max(0,(e.sim_time||0)-(e.sfi_sfe||0));
    a.pic += (e.pic||0);
    a.picus += (e.picus||0);
    a.sic += (e.sic||0);
    a.dual += (e.dual||0);
    a.solo += (e.solo||0);
    a.night += (e.night||0);
    a.ifr += (e.ifr||0);
    a.sim_inst += (e.sim_inst||0);
    a.xc += (e.xc||0);
    a.day_ldgs += (e.day_landings||0);
    a.night_ldgs += (e.night_landings||0);
    a.approaches += (e.approaches||[]).length;
    a.pf_time += e.pilot_flying ? (e.total_time||0) : 0;
    return a;
  }, {total:0,flight:0,sim:0,sfi_sfe:0,sim_student:0,pic:0,picus:0,sic:0,dual:0,solo:0,night:0,ifr:0,sim_inst:0,xc:0,day_ldgs:0,night_ldgs:0,approaches:0,pf_time:0});
  // Total flying hours (real aircraft + sim time received as a student), excluding
  // hours spent instructing/examining others in the simulator (SFI/SFE)
  t.flying_excl_sfi = t.total - t.sfi_sfe;
  return t;
}

function filteredFlights() {
  return state.flights.filter(f => {
    if (state.filterType && f.aircraft_type !== state.filterType) return false;
    if (state.filterRole && f.pilot_role !== state.filterRole) return false;
    if (state.searchQ) {
      const q = state.searchQ.toLowerCase();
      const hay = [f.aircraft_reg,f.aircraft_type,f.dep_airport,f.arr_airport,f.route,f.remarks,f.instructor,f.lesson].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

// ─── RENDER HELPERS ───────────────────────────────────────────────────────────
function el(tag, props={}, ...children) {
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(props)) {
    if (k === 'onclick') e.onclick = v;
    else if (k === 'oninput') e.oninput = v;
    else if (k === 'onchange') e.onchange = v;
    else if (k === 'class') e.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null) continue;
    if (typeof c === 'string' || typeof c === 'number') e.appendChild(document.createTextNode(String(c)));
    else if (c instanceof Node) e.appendChild(c);
    else if (Array.isArray(c)) c.forEach(x => x instanceof Node && e.appendChild(x));
  }
  return e;
}
const div = (p,...c) => el('div',p,...c);
const span = (p,...c) => el('span',p,...c);
const btn = (p,...c) => el('button',p,...c);
const inp = (p) => el('input',p);
const sel = (p,...c) => el('select',p,...c);
const opt = (v,t,s) => { const o=el('option',{value:v},t||v); if(s) o.selected=true; return o; };

function statCard(label, value, unit='h', color='var(--sky)') {
  return div({class:'stat'},
    div({class:'stat-label'},label),
    div({class:'stat-value',style:{color}},
      typeof value === 'number' ? (unit==='h'?value.toFixed(1):Math.round(value)) : value,
      span({class:'stat-unit'},unit)
    )
  );
}

function pbar(current, req, color='var(--sky)') {
  const pct = Math.min(100, (current/req)*100);
  const done = current >= req;
  const wrap = div({class:'pbar-wrap', style:{marginTop:'4px'}});
  const fill = div({class:'pbar-fill', style:{width:pct+'%', background:done?'var(--green)':color}});
  wrap.appendChild(fill);
  return wrap;
}

function modal(title, content, onClose, wide=false) {
  const bg = div({class:'modal-bg', onclick: e => { if(e.target===bg) onClose(); }});
  const m = div({class:'modal', style:{maxWidth:wide?'700px':'520px'}});
  const head = div({class:'modal-head'},
    span({style:{fontWeight:800,fontSize:15,color:'var(--text)'}}, title),
    btn({class:'close-btn', onclick:onClose}, 'x')
  );
  const body = div({class:'modal-body'});
  body.appendChild(content);
  m.appendChild(head);
  m.appendChild(body);
  bg.appendChild(m);
  return bg;
}

function fieldGroup(label, input) {
  const wrap = div({class:'field'});
  wrap.appendChild(el('label',{},label));
  wrap.appendChild(input);
  return wrap;
}

function numInp(val, onChange) {

    style:{width:'100%',background:'var(--bg)',border:'1px solid var(--border)',borderRadius:'6px',padding:'7px 10px',color:'var(--text)',fontSize:'13px',fontFamily:'monospace'},
    oninput: e => onChange(parseFloat(e.target.value)||0)});

    blockTime = Math.round(blockTime * 10) / 10; // round to 1 decimal

    const isInstr = ['Instructor (FI)','Instructor (TRI)','Examiner (TRE)','Examiner (DFE)','Training Captain','Check Captain'].includes(data.pilot_role);

    if (isSim) {
      // Simulator duty: time goes to sim_time
      data.sim_time = blockTime;
      data.total_time = 0;
      if (isInstr) {
        // Instructing/examining in sim: record as SFI/SFE hours (kept separate
        // from sim_inst, which tracks instrument time flown in the sim)
        data.sfi_sfe = blockTime;
      } else {
        data.sfi_sfe = 0;
      }
    } else {
      // Flight duty: time goes to total_time
      data.total_time = blockTime;
      data.sim_time = 0;
      data.sfi_sfe = 0;
      // Auto-calculate night time (civil twilight) from the departure/arrival
      // airports' coordinates - leaves data.night untouched if either airport
      // is unrecognised, so a manual entry is never silently overwritten.
      const nightCalc = computeNightHours(data.dep_airport, data.arr_airport, data.date, data.chocks_off, data.chocks_on, blockTime);
      if (nightCalc !== null) data.night = nightCalc;
      // Cross-country: landing at a point other than departure. Auto-set once
      // both airports are entered; leave untouched (don't force to 0) until
      // then, so an in-progress entry isn't zeroed before you've typed To yet.
      if (data.dep_airport && data.arr_airport) {
        data.xc = (data.dep_airport !== data.arr_airport) ? blockTime : 0;
      }
    }

    updateTimeDisplay();
  }

          toast('Return sector ready - fill in times and save');
        }
      }catch(e){ toast('Error: '+e.message,'var(--red)'); }
    }},'Save Flight'));
  form.appendChild(btns);

  return form;
}

  row4.appendChild(div({style:{flex:'1',minWidth:'110px'}}, fld('Licence / Auth No', mkI('licence_no','text','SACAA number'))));

    scanStatus.innerHTML = '';

// ─── IMPORT SCREEN ────────────────────────────────────────────────────────────
function renderImport() {
  let parsed = null;
  const content = div({});

  const info = div({style:{background:'var(--card)',border:'1px solid var(--border)',borderRadius:'8px',padding:'12px 14px',marginBottom:'14px',fontSize:'12px',color:'var(--steel)',lineHeight:'1.7'}});
  info.innerHTML = '<strong style="color:var(--text)">Supported formats:</strong><br>' +
    '- LogTen Pro: File > Export > Tab-delimited (.txt)<br>' +
    '- MyFlightbook: Export > CSV<br>' +
    '- Any tab-delimited or CSV logbook export<br><br>' +
    '<strong style="color:var(--amber)">Note:</strong> Duplicate detection is not automatic - avoid importing the same file twice.';
  content.appendChild(info);

  const zone = div({class:'upload-zone'});
  zone.innerHTML = '<div style="font-size:32px;margin-bottom:8px">+</div><div style="font-size:14px;color:var(--steel);margin-bottom:4px">Drop your logbook export here</div><div style="font-size:11px;color:var(--muted)">Tab-delimited .txt or .csv</div>';

  const fileInp = inp({type:'file',accept:'.txt,.csv,.tsv',style:{display:'none'}});
  fileInp.onchange = e => { if(e.target.files[0]) processFile(e.target.files[0]); };
  zone.onclick = () => fileInp.click();
  zone.ondragover = e => { e.preventDefault(); zone.classList.add('drag'); };
  zone.ondragleave = () => zone.classList.remove('drag');
  zone.ondrop = e => { e.preventDefault(); zone.classList.remove('drag'); if(e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]); };

  content.appendChild(zone);
  content.appendChild(fileInp);

  const preview = div({style:{marginTop:'12px'}});
  content.appendChild(preview);

  function processFile(file) {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        parsed = parseLogTenPro(e.target.result);
        preview.innerHTML = '';
        const ok = div({class:'ok'}, parsed.length + ' entries parsed from ' + file.name + '. Ready to import.');
        preview.appendChild(ok);
        const importBtn = btn({style:{background:'var(--green)',border:'none',color:'var(--gold)',borderRadius:'8px',padding:'10px 20px',fontSize:'14px',fontWeight:'700',cursor:'pointer',width:'100%'},
          onclick:async()=>{
            importBtn.disabled=true;
            importBtn.textContent='Importing...';
            preview.appendChild(div({id:'import-progress',style:{fontSize:'12px',color:'var(--steel)',marginTop:'8px',textAlign:'center'}},'Starting...'));
            try {
              const count = await importEntries(parsed);
              preview.innerHTML = '';
              preview.appendChild(div({class:'ok'},count+' entries imported successfully!'));
              setTimeout(()=>setState({showImport:false}), 2000);
            } catch(err) {
              preview.appendChild(div({class:'err'},'Import error: '+err.message));
              importBtn.disabled=false;
              importBtn.textContent='Try Again';
            }
          }
        },'Import ' + parsed.length + ' Entries');
        preview.appendChild(importBtn);
      } catch(e) {
        preview.innerHTML = '';
        preview.appendChild(div({class:'err'},'Parse error: '+e.message));
      }
    };
    reader.readAsText(file, 'utf-8');
  }

  return content;
}

  else if (state.tab === 'recency') {
    const cut90 = new Date(Date.now() - 90 * 86400000);
    const cut6m = new Date(now.getFullYear(), now.getMonth() - 6, now.getDate());
    const last90 = state.flights.filter(f => new Date(f.date) >= cut90);
    const last90Desc = [...last90].sort((a,b)=>(b.date||'').localeCompare(a.date||''));

    // Days remaining before a rolling 90-day requirement lapses: walks the most
    // recent qualifying flights until the required count is reached, then
    // returns days left until that anchor flight ages out of the 90-day window.
    function daysToLapse(sortedDesc, getVal, required) {
      let cum = 0;
      for (const f of sortedDesc) {
        cum += getVal(f);
        if (cum >= required) {
          const daysSince = Math.floor((now - new Date(f.date)) / 86400000);
          return Math.max(0, 90 - daysSince);
        }
      }
      return null;
    }

    // Movements in last 90 days
    // Part 121 operations: 3 takeoffs and landings in preceding 90 days, day or night combined - no separate night-only requirement
    const dayTO90_only   = last90.reduce((a,f)=>a+(f.day_takeoffs||0),0);
    const nightTO90 = last90.reduce((a,f)=>a+(f.night_takeoffs||0),0);
    const dayLdg90_only  = last90.reduce((a,f)=>a+(f.day_landings||0),0);
    const nightLdg90= last90.reduce((a,f)=>a+(f.night_landings||0),0);
    // Day recency includes both day AND night movements
    const dayTO90  = dayTO90_only + nightTO90;
    const dayLdg90 = dayLdg90_only + nightLdg90;
    const toDaysLeft  = daysToLapse(last90Desc, f=>(f.day_takeoffs||0)+(f.night_takeoffs||0), 3);
    const ldgDaysLeft = daysToLapse(last90Desc, f=>(f.day_landings||0)+(f.night_landings||0), 3);

    // RNP and CAT II/III approach currency (Part 121) - from per-flight summary counts
    const rnpCount90   = last90.reduce((a,f)=>a+(f.rnav_approaches||0),0);
    const cat23Count90 = last90.reduce((a,f)=>a+(f.catii||0)+(f.catiii||0),0);
    const rnpDaysLeft   = daysToLapse(last90Desc, f=>(f.rnav_approaches||0), 1);
    const cat23DaysLeft = daysToLapse(last90Desc, f=>(f.catii||0)+(f.catiii||0), 1);

    // A330/A340 combined type rating - at least 1 landing in either family in preceding 90 days
    const a330a340Types = ['A333','A343','A346'];
    const isA330A340 = f => a330a340Types.some(t=>(f.aircraft_type||'').includes(t));
    const a330a340Ldg90    = last90.filter(isA330A340).reduce((a,f)=>a+(f.day_landings||0)+(f.night_landings||0),0);
    const a330a340DaysLeft = daysToLapse(last90Desc.filter(isA330A340), f=>(f.day_landings||0)+(f.night_landings||0), 1);

    // Approaches in last 90 days (from LogTenPro-imported per-flight summary counts)
    const totalApchCount90 = last90.reduce((a,f)=>a+(f.ils_approaches||0)+(f.rnav_approaches||0)+(f.catii||0)+(f.catiii||0),0);
    const precisionApchCount90 = last90.reduce((a,f)=>a+(f.ils_approaches||0)+(f.catii||0)+(f.catiii||0),0);
    const totalApchDaysLeft = daysToLapse(last90Desc, f=>(f.ils_approaches||0)+(f.rnav_approaches||0)+(f.catii||0)+(f.catiii||0), 2);
    const precisionApchDaysLeft = daysToLapse(last90Desc, f=>(f.ils_approaches||0)+(f.catii||0)+(f.catiii||0), 1);

    // OPC from endorsements
    const lastOPC = [...state.endorsements].filter(e=>e.category==='OPC / LPC').sort((a,b)=>(b.date_issued||'').localeCompare(a.date_issued||''))[0];

    const medExp = lastMed&&lastMed.expiry_date?new Date(lastMed.expiry_date):null;
    const medDays = medExp?Math.round((medExp-now)/86400000):null;
    const medOk = medDays!==null&&medDays>0;

    // Type recency
    const typeMap = {};
    state.flights.forEach(f=>{
      const t=f.aircraft_type||'Unknown';
      if(!typeMap[t]||f.date>typeMap[t].date) typeMap[t]=f;
    });

    function badge(ok) {

    // Best-effort field extraction from raw OCR text. Runs entirely on-device (no AI
    // model, no API key, no billing) using keyword and pattern matching. Much less
    // reliable than an AI model at telling fields apart, so everything here is meant
    // to be reviewed and corrected below, not trusted blindly.
    // Converts a loosely-formatted date string (as read off a document) into the
    // strict ISO "YYYY-MM-DD" that the <input type="date"> fields and the
    // Postgres `date` columns require. Returns '' if it can't be parsed with
    // confidence — an empty field is safer than one that fails to save.
    function normalizeDateStr(s) {
      if (!s) return '';
      s = String(s).trim().replace(/\s+/g,' ');

      // Already ISO-ish: YYYY-MM-DD / YYYY/MM/DD / YYYY.MM.DD
      let m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
      if (m) {
        const [, y, mo, d] = m;
        if (+mo>=1 && +mo<=12 && +d>=1 && +d<=31) return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      }

      // DD Month YYYY (month name, e.g. "30 September 2025" / "30-Sep-2025")
      const months = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
      m = s.match(/^(\d{1,2})[\/\-. ]([A-Za-z]{3,9})[\/\-. ](\d{2,4})$/);
      if (m) {
        const mo = months[m[2].slice(0,3).toLowerCase()];
        let y = m[3]; if (y.length===2) y = (+y<50?'20':'19')+y;
        const d = m[1];
        if (mo && +d>=1 && +d<=31) return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      }

      // DD/MM/YYYY or DD-MM-YYYY or DD.MM.YYYY (day-first, standard on SA/ICAO documents)
      m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
      if (m) {
        let [, a, b, y] = m;
        if (y.length===2) y = (+y<50?'20':'19')+y;
        let day = +a, mon = +b;
        if (mon > 12 && day <= 12) { const t=day; day=mon; mon=t; } // swap if only valid the other way round
        if (mon>=1 && mon<=12 && day>=1 && day<=31) return y+'-'+String(mon).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      }

      return ''; // not confident enough to guess - leave blank for manual entry
    }

    function extractFieldsFromText(text) {
      const result = { category:'', title:'', aircraft_type:'', date_issued:'', expiry_date:'', instructor:'', licence_no:'', ca_form:'', remarks:'' };
      if (!text) return result;

      if (/medical/i.test(text)) result.category = 'Medical Certificate';
      else if (/instrument rating|\bIR\b/i.test(text)) result.category = 'Instrument Rating';
      else if (/type rating|class rating/i.test(text)) result.category = 'Type / Class Rating';
      else if (/night rating/i.test(text)) result.category = 'Night Rating';
      else if (/\bOPC\b|\bLPC\b|proficiency check/i.test(text)) result.category = 'OPC / LPC';
      else if (/skills test/i.test(text)) result.category = 'Skills Test';
      else if (/ground exam/i.test(text)) result.category = 'Ground Examination';
      else if (/licen[cs]e|\bATPL\b|\bCPL\b|\bPPL\b/i.test(text)) result.category = 'PPL / Licence';

      const dateRe = /\b\d{1,2}[\/\-. ][A-Za-z]{3,9}[\/\-. ]\d{2,4}\b|\b\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}\b|\b\d{4}[\/\-.]\d{1,2}[\/\-.]\d{1,2}\b/g;
      const allDates = text.match(dateRe) || [];
      if (allDates[0]) result.date_issued = allDates[0];
      if (allDates[1]) result.expiry_date = allDates[1];

      const issuedMatch = text.match(/(?:date of issue|issued|issue date)[:\s]*([0-9A-Za-z\/\-. ]{6,20})/i);
      if (issuedMatch) result.date_issued = issuedMatch[1].trim();
      const expiryMatch = text.match(/(?:expiry|expires|valid until|valid to)[:\s]*([0-9A-Za-z\/\-. ]{6,20})/i);
      if (expiryMatch) result.expiry_date = expiryMatch[1].trim();

      // Normalize whatever we found into strict ISO format (YYYY-MM-DD) so it
      // actually lands correctly in the date-picker fields and saves cleanly.
      // If a match can't be parsed with confidence, leave it blank rather than
      // pass through a raw string that would fail to save.
      result.date_issued = normalizeDateStr(result.date_issued);
      result.expiry_date = normalizeDateStr(result.expiry_date);

      const licMatch = text.match(/(?:licen[cs]e no\.?|certificate no\.?|ref(?:erence)? no\.?)[:\s]*([A-Z0-9\-\/]{4,20})/i);
      if (licMatch) result.licence_no = licMatch[1];

      const acMatch = text.match(/\b([A-Z]{1,2}\d{2,3}[A-Z]?)\b/);
      if (acMatch) result.aircraft_type = acMatch[1];

      const nameMatch = text.match(/(?:examiner|instructor|signed by|\bAME\b)[:\s]*([A-Za-z][A-Za-z.\s]{3,40})/i);
      if (nameMatch) result.instructor = nameMatch[1].trim();

      const caMatch = text.match(/\bCA[\s\-]?\d{2}[\-.]?\d{2,3}(?:\.\d+)?(?:\([0-9a-z]\))?/i);
      if (caMatch) result.ca_form = caMatch[0];

      result.remarks = 'Auto-filled from on-device OCR — please check every field carefully before saving.';
      return result;
    }

    async function processDocScan(file) {
      scanZone.innerHTML = '';
      scanZone.style.background = '#E8F0F8';
      const progressLine = div({style:{padding:'20px',textAlign:'center',color:'#0066CC',fontSize:'13px',fontWeight:'600'}},'Reading document...');
      scanZone.appendChild(progressLine);

      try {
        const isPDF = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
        let ocrSource = file;

        if (isPDF) {
          if (!window.pdfjsLib) throw new Error('PDF reader failed to load. Try again, or convert the PDF to a photo/JPG first.');
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          const page = await pdf.getPage(1);
          const viewport = page.getViewport({ scale: 2.5 });
          const canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          const ctx = canvas.getContext('2d');
          await page.render({ canvasContext: ctx, viewport }).promise;
          ocrSource = canvas;
        }

        if (!window.Tesseract) throw new Error('OCR engine failed to load. Check your connection and try again.');

        const { data } = await Tesseract.recognize(ocrSource, 'eng', {
          logger: m => {

              progressLine.textContent = 'Reading document... ' + Math.round(m.progress*100) + '%';
            }
          }
        });
        const rawText = (data && data.text || '').trim();
        if (!rawText) {
          throw new Error('Could not find any readable text on this document. Try a clearer photo, or add the endorsement manually.');
        }

        const extracted = extractFieldsFromText(rawText);

        scanResult.appendChild(rawDetails);

        // Show extracted fields
        const fields = div({style:{background:'#F8F9FA',borderRadius:'8px',padding:'12px',marginBottom:'12px',border:'1px solid #DEE2E6'}});
        Object.entries(extracted).filter(([k,v])=>v).forEach(([k,v])=>{

          row.appendChild(el('span',{style:{color:'#1A1A1A',fontWeight:'600'}},String(v)));
          fields.appendChild(row);
        });
        scanResult.appendChild(fields);

        const saveBtns = div({style:{display:'flex',gap:'8px',justifyContent:'flex-end'}});
        saveBtns.append(btn({style:{background:'none',border:'1px solid #CED4DA',color:'#555',borderRadius:'7px',padding:'8px 16px',fontSize:'13px',cursor:'pointer'},
          onclick:()=>{
            // Open endorsement form pre-filled with extracted data
            setState({showAIScan:false, showEndorseForm:true, editEndorse:{
              category: extracted.category || 'Other',
              title: extracted.title || '',
              aircraft_type: extracted.aircraft_type || '',
              date_issued: extracted.date_issued || today(),
              expiry_date: extracted.expiry_date || '',
              instructor: extracted.instructor || '',
              licence_no: extracted.licence_no || '',
              ca_form: extracted.ca_form || '',
              submitted: false,
              remarks: extracted.remarks || '',
            }});

            try {

                ca_form: extracted.ca_form || '',
                submitted: false,

            } catch(e) {
              toast('Error saving: '+e.message,'var(--red)');
            }

        scanResult.appendChild(saveBtns);

      } catch(err) {

        scanResult.appendChild(div({style:{background:'#FFEBEE',border:'1px solid #FFCDD2',borderRadius:'7px',padding:'10px 14px',color:'#C62828',fontSize:'13px'}},

        scanZone.appendChild(div({style:{fontSize:'11px',color:'#888'}},'PDF, JPG, PNG, HEIC supported'));

      f.pilot_role?span({},span({style:{color:'var(--muted)'}},'Role: '),span({style:{color:'var(--amber)',fontWeight:'700'}},f.pilot_role)):null,
      f.duty_role?span({},span({style:{color:'var(--muted)'}},'Duty: '),span({style:{color:'var(--gold)',fontWeight:'700'}},f.duty_role)):null,
      f.instructor?span({},span({style:{color:'var(--muted)'}},'Instr: '),span({style:{color:'var(--text)'}},f.instructor)):null,
      f.chocks_off?span({},span({style:{color:'var(--muted)'}},'Off Blocks: '),span({style:{color:'var(--text)',fontFamily:'monospace'}},f.chocks_off+' Z')):null,
      f.chocks_on?span({},span({style:{color:'var(--muted)'}},'On Blocks: '),span({style:{color:'var(--text)',fontFamily:'monospace'}},f.chocks_on+' Z')):null,

    ));
    if(f.lesson) content.appendChild(div({style:{background:'var(--sky)11',borderRadius:'7px',padding:'8px 12px',marginBottom:'8px',border:'1px solid var(--sky)33',fontSize:'12px',color:'var(--sky)'}},'Lesson: '+f.lesson));
    if(f.remarks) content.appendChild(div({style:{background:'var(--bg)',borderRadius:'7px',padding:'9px 12px',marginBottom:'10px',fontSize:'12px',color:'var(--steel)',lineHeight:'1.6',borderLeft:'3px solid var(--green)',border:'1px solid var(--border)',borderLeftColor:'var(--green)'}},f.remarks));
    const brow = div({style:{display:'flex',gap:'8px',justifyContent:'flex-end',paddingTop:'10px',borderTop:'1px solid var(--border)'}});
    brow.appendChild(btn({style:{background:'none',border:'1px solid var(--red)',color:'var(--red)',borderRadius:'7px',padding:'7px 14px',fontSize:'12px',cursor:'pointer'},onclick:()=>deleteFlight(f.id)},'Delete'));
    brow.appendChild(btn({style:{background:'var(--green)',border:'none',color:'var(--gold)',borderRadius:'7px',padding:'7px 14px',fontSize:'12px',fontWeight:'700',cursor:'pointer'},onclick:()=>{setState({viewFlight:null,editFlight:f,showFlightForm:true});}},'Edit'));
    content.appendChild(brow);
    app.appendChild(modal('Flight Detail', content, ()=>setState({viewFlight:null})));
  }

  if (state.showDocUpload) {
    const docTypes = [['medical','Medical Certificate'],['licence','Licence / Certificate'],['endorsement_scan','Endorsement Scan'],['logbook_page','Logbook Page'],['other','Other']];
    let selType = 'other'; let notes = '';
    const content2 = div({});
    const zone2 = div({class:'upload-zone',style:{marginBottom:'12px'}});
    zone2.innerHTML = '<div style="font-size:28px;margin-bottom:6px">+</div><div style="font-size:13px;color:var(--steel);margin-bottom:3px">Click or drop file here</div><div style="font-size:11px;color:var(--muted)">PDF, JPG, PNG - max 10MB</div>';
    const fileInp2 = inp({type:'file',accept:'.pdf,.jpg,.jpeg,.png,.gif,.heic,.webp',style:{display:'none'}});
    const preview2 = div({});
    const si4 = {width:'100%',background:'#FFFFFF',border:'1px solid #CED4DA',borderRadius:'6px',padding:'8px 12px',color:'#1A1A1A',fontSize:'13px',fontFamily:'inherit',marginBottom:'10px'};
    const dtSel = sel({style:{...si4,cursor:'pointer',display:'block'},onchange:e=>{selType=e.target.value;}});
    docTypes.forEach(([v,t])=>dtSel.appendChild(opt(v,t,false)));
    const ntInp = inp({type:'text',placeholder:'Notes (optional)',style:{...si4},oninput:e=>{notes=e.target.value;}});
    fileInp2.onchange = async e => {
      if(!e.target.files[0]) return;
      const file = e.target.files[0];
      if(file.size > 10*1024*1024) { preview2.innerHTML=''; preview2.appendChild(div({class:'err'},'File too large (max 10MB)')); return; }
      preview2.innerHTML='';
      const pb = div({class:'ok'},'Uploading '+file.name+'...');
      preview2.appendChild(pb);
      try {
        await uploadDocument(file, selType, notes);
        pb.textContent = 'Uploaded successfully!';
        setTimeout(()=>setState({showDocUpload:false}),1500);
      } catch(err) {
        preview2.innerHTML=''; preview2.appendChild(div({class:'err'},'Upload error: '+err.message));
      }
    };
    zone2.onclick = ()=>fileInp2.click();
    zone2.ondragover = e=>{e.preventDefault();zone2.classList.add('drag');};
    zone2.ondragleave = ()=>zone2.classList.remove('drag');
    zone2.ondrop = e=>{e.preventDefault();zone2.classList.remove('drag');fileInp2.files=e.dataTransfer.files;fileInp2.onchange({target:{files:e.dataTransfer.files}});};
    content2.appendChild(div({class:'field'},el('label',{},'Document Type'),dtSel));
    content2.appendChild(div({class:'field'},el('label',{},'Notes'),ntInp));
    content2.appendChild(zone2);
    content2.appendChild(fileInp2);
    content2.appendChild(preview2);
    app.appendChild(modal('Upload Document', content2, ()=>setState({showDocUpload:false})));
  }
}


// ── SERVICE WORKER + OFFLINE SUPPORT ─────────────────────────────────────────

// IndexedDB for local flight data cache
const IDB_NAME = 'salogbook-local';
const IDB_VERSION = 1;
let idb = null;

function openIDB() {
  return new Promise((resolve, reject) => {
    if (idb) return resolve(idb);
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('flights')) {
        db.createObjectStore('flights', {keyPath: 'id'});
      }
      if (!db.objectStoreNames.contains('endorsements')) {
        db.createObjectStore('endorsements', {keyPath: 'id'});
      }
      if (!db.objectStoreNames.contains('queue')) {
        db.createObjectStore('queue', {keyPath: 'id', autoIncrement: true});
      }
    };
    req.onsuccess = e => { idb = e.target.result; resolve(idb); };
    req.onerror = () => reject(req.error);
  });
}

async function idbGetAll(store) {
  const db = await openIDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => resolve([]);
  });
}

async function idbPutAll(store, items) {
  if (!items || !items.length) return;
  const db = await openIDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const s = tx.objectStore(store);
    items.forEach(item => s.put(item));
    tx.oncomplete = resolve;
    tx.onerror = () => resolve();
  });
}

async function idbDelete(store, id) {
  const db = await openIDB();
  return new Promise((resolve) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(id);
    tx.oncomplete = resolve;
    tx.onerror = resolve;
  });
}

async function idbClear(store) {
  const db = await openIDB();
  return new Promise((resolve) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).clear();
    tx.oncomplete = resolve;
    tx.onerror = resolve;
  });
}async function idbQueueAdd(item) {
  const db = await openIDB();
  return new Promise((resolve) => {
    const tx = db.transaction('queue', 'readwrite');
    tx.objectStore('queue').add(item);
    tx.oncomplete = resolve;
    tx.onerror = resolve;
  });
}

// Online/offline state
let isOnline = navigator.onLine;
window.addEventListener('online', async () => {
  isOnline = true;
  toast('Back online - syncing...', 'var(--green)');
  await syncOfflineQueue();
  if (state.session) await loadAll();
  render();
});
window.addEventListener('offline', () => {
  isOnline = false;
  toast('Offline - using local data', 'var(--amber)');
  render();
});

// Sync queued offline changes to Supabase
async function syncOfflineQueue() {
  if (!isOnline || !state.session) return;
  const queue = await idbGetAll('queue');
  if (!queue.length) return;
  const db = await openIDB();
  for (const item of queue) {
    try {
      if (item.action === 'insert') {
        await sb.from(item.table).insert(item.data);
      } else if (item.action === 'update') {
        await sb.from(item.table).update(item.data).eq('id', item.data.id);
      } else if (item.action === 'delete') {
        await sb.from(item.table).delete().eq('id', item.id);
      }
      await new Promise((resolve) => {
        const tx = db.transaction('queue', 'readwrite');
        tx.objectStore('queue').delete(item.id);
        tx.oncomplete = resolve;
      });
    } catch(e) {
      console.error('Sync failed for item', item, e);
    }
  }
  toast('Sync complete', 'var(--green)');
}

// Register service worker. The SW itself is network-first for the app shell and
// its precached critical dependencies (see sw.js), so it self-updates on every
// online load without needing to be torn down and rebuilt here - doing that left
// a window with NO active service worker at all (unregister, then a 1-second
// delay before a new one existed), which broke fully offline cold launches.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/salogbook/sw.js').then(reg => {
    console.log('SW registered:', reg.scope);
  }).catch(err => {
    console.log('SW registration failed:', err);
  });
  navigator.serviceWorker.addEventListener('message', async e => {
    if (e.data && e.data.type === 'SYNC_NEEDED') {
      await syncOfflineQueue();
    }
  });
}

// Boot
render();
